<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#0F1C33"/>
  
  <!-- Title -->
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">第十周: 从0-1构建多模态LLM</text>
  
  <!-- Underline -->
  <line x1="240" y1="200" x2="560" y2="200" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Circle with "Multimodal" -->
  <circle cx="400" cy="300" r="80" stroke="#4ECDC4" stroke-width="2" fill="none"/>
  
  <!-- Vertical line in circle -->
  <line x1="400" y1="220" x2="400" y2="380" stroke="#4ECDC4" stroke-width="2"/>
  
  <!-- Horizontal line in circle -->
  <line x1="320" y1="300" x2="480" y2="300" stroke="#4ECDC4" stroke-width="2"/>
  
  <!-- Text in circle -->
  <text x="400" y="310" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Multimodal</text>
  
  <!-- Slogan -->
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">图片转化为文本表达</text>
  
  <!-- Underline -->
  <line x1="260" y1="440" x2="540" y2="440" stroke="#4ECDC4" stroke-width="2"/>
</svg>
