<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f8f9fa" />
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#333">卷积操作详细计算过程</text>
  
  <!-- 输入图像 -->
  <rect x="50" y="70" width="200" height="200" fill="none" stroke="#333" stroke-width="1" />
  <text x="150" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">输入图像 (5x5)</text>
  
  <!-- 输入图像网格 -->
  <line x1="50" y1="110" x2="250" y2="110" stroke="#333" stroke-width="0.5" />
  <line x1="50" y1="150" x2="250" y2="150" stroke="#333" stroke-width="0.5" />
  <line x1="50" y1="190" x2="250" y2="190" stroke="#333" stroke-width="0.5" />
  <line x1="50" y1="230" x2="250" y2="230" stroke="#333" stroke-width="0.5" />
  
  <line x1="90" y1="70" x2="90" y2="270" stroke="#333" stroke-width="0.5" />
  <line x1="130" y1="70" x2="130" y2="270" stroke="#333" stroke-width="0.5" />
  <line x1="170" y1="70" x2="170" y2="270" stroke="#333" stroke-width="0.5" />
  <line x1="210" y1="70" x2="210" y2="270" stroke="#333" stroke-width="0.5" />
  
  <!-- 输入图像数值 -->
  <text x="70" y="90" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  <text x="110" y="90" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">2</text>
  <text x="150" y="90" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">3</text>
  <text x="190" y="90" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">4</text>
  <text x="230" y="90" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">5</text>
  
  <text x="70" y="130" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">6</text>
  <text x="110" y="130" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">7</text>
  <text x="150" y="130" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">8</text>
  <text x="190" y="130" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">9</text>
  <text x="230" y="130" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">10</text>
  
  <text x="70" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">11</text>
  <text x="110" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">12</text>
  <text x="150" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">13</text>
  <text x="190" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">14</text>
  <text x="230" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">15</text>
  
  <text x="70" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">16</text>
  <text x="110" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">17</text>
  <text x="150" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">18</text>
  <text x="190" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">19</text>
  <text x="230" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">20</text>
  
  <text x="70" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">21</text>
  <text x="110" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">22</text>
  <text x="150" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">23</text>
  <text x="190" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">24</text>
  <text x="230" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">25</text>
  
  <!-- 卷积核 -->
  <rect x="330" y="120" width="120" height="120" fill="none" stroke="#333" stroke-width="1" />
  <text x="390" y="110" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">卷积核 (3x3)</text>
  
  <!-- 卷积核网格 -->
  <line x1="330" y1="160" x2="450" y2="160" stroke="#333" stroke-width="0.5" />
  <line x1="330" y1="200" x2="450" y2="200" stroke="#333" stroke-width="0.5" />
  
  <line x1="370" y1="120" x2="370" y2="240" stroke="#333" stroke-width="0.5" />
  <line x1="410" y1="120" x2="410" y2="240" stroke="#333" stroke-width="0.5" />
  
  <!-- 卷积核数值 -->
  <text x="350" y="140" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  <text x="390" y="140" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">0</text>
  <text x="430" y="140" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  
  <text x="350" y="180" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">0</text>
  <text x="390" y="180" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  <text x="430" y="180" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">0</text>
  
  <text x="350" y="220" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  <text x="390" y="220" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">0</text>
  <text x="430" y="220" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  
  <!-- 特征图 -->
  <rect x="550" y="120" width="120" height="120" fill="none" stroke="#333" stroke-width="1" />
  <text x="610" y="110" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">输出特征图 (3x3)</text>
  
  <!-- 特征图网格 -->
  <line x1="550" y1="160" x2="670" y2="160" stroke="#333" stroke-width="0.5" />
  <line x1="550" y1="200" x2="670" y2="200" stroke="#333" stroke-width="0.5" />
  
  <line x1="590" y1="120" x2="590" y2="240" stroke="#333" stroke-width="0.5" />
  <line x1="630" y1="120" x2="630" y2="240" stroke="#333" stroke-width="0.5" />
  
  <!-- 特征图数值 -->
  <text x="570" y="140" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">31</text>
  <text x="610" y="140" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">37</text>
  <text x="650" y="140" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">43</text>
  
  <text x="570" y="180" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">57</text>
  <text x="610" y="180" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">63</text>
  <text x="650" y="180" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">69</text>
  
  <text x="570" y="220" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">83</text>
  <text x="610" y="220" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">89</text>
  <text x="650" y="220" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">95</text>
  
  <!-- 箭头 -->
  <line x1="260" y1="170" x2="320" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="460" y1="170" x2="540" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  
  <!-- 计算过程示例 -->
  <rect x="100" y="290" width="600" height="190" fill="#e9ecef" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="310" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">卷积计算过程示例</text>
  
  <!-- 输入区域 -->
  <rect x="150" y="330" width="120" height="120" fill="none" stroke="#333" stroke-width="1" />
  
  <!-- 输入区域网格 -->
  <line x1="150" y1="370" x2="270" y2="370" stroke="#333" stroke-width="0.5" />
  <line x1="150" y1="410" x2="270" y2="410" stroke="#333" stroke-width="0.5" />
  
  <line x1="190" y1="330" x2="190" y2="450" stroke="#333" stroke-width="0.5" />
  <line x1="230" y1="330" x2="230" y2="450" stroke="#333" stroke-width="0.5" />
  
  <!-- 输入区域数值 -->
  <text x="170" y="350" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">7</text>
  <text x="210" y="350" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">8</text>
  <text x="250" y="350" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">9</text>
  
  <text x="170" y="390" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">12</text>
  <text x="210" y="390" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">13</text>
  <text x="250" y="390" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">14</text>
  
  <text x="170" y="430" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">17</text>
  <text x="210" y="430" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">18</text>
  <text x="250" y="430" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">19</text>
  
  <!-- 卷积核 -->
  <rect x="340" y="330" width="120" height="120" fill="none" stroke="#333" stroke-width="1" />
  
  <!-- 卷积核网格 -->
  <line x1="340" y1="370" x2="460" y2="370" stroke="#333" stroke-width="0.5" />
  <line x1="340" y1="410" x2="460" y2="410" stroke="#333" stroke-width="0.5" />
  
  <line x1="380" y1="330" x2="380" y2="450" stroke="#333" stroke-width="0.5" />
  <line x1="420" y1="330" x2="420" y2="450" stroke="#333" stroke-width="0.5" />
  
  <!-- 卷积核数值 -->
  <text x="360" y="350" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  <text x="400" y="350" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">0</text>
  <text x="440" y="350" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  
  <text x="360" y="390" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">0</text>
  <text x="400" y="390" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  <text x="440" y="390" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">0</text>
  
  <text x="360" y="430" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  <text x="400" y="430" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">0</text>
  <text x="440" y="430" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  
  <!-- 计算公式 -->
  <text x="500" y="390" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">=</text>
  <text x="550" y="350" text-anchor="start" font-family="Arial" font-size="14" fill="#333">7×1 + 8×0 + 9×1 +</text>
  <text x="550" y="370" text-anchor="start" font-family="Arial" font-size="14" fill="#333">12×0 + 13×1 + 14×0 +</text>
  <text x="550" y="390" text-anchor="start" font-family="Arial" font-size="14" fill="#333">17×1 + 18×0 + 19×1 =</text>
  <text x="550" y="420" text-anchor="start" font-family="Arial" font-size="14" fill="#333">7 + 9 + 13 + 17 + 19 = 65</text>
  <text x="550" y="440" text-anchor="start" font-family="Arial" font-size="14" fill="#333">(输出特征图中心位置的值)</text>
</svg>
