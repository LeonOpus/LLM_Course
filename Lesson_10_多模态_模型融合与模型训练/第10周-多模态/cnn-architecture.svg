<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- 背景 -->
  <rect width="800" height="400" fill="#f8f9fa" />
  
  <!-- 输入图像 -->
  <rect x="20" y="150" width="80" height="80" fill="#A7C7E7" stroke="#333" stroke-width="1.5" />
  <text x="60" y="130" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">输入图像</text>
  
  <!-- 第一个卷积层 -->
  <rect x="150" y="135" width="60" height="60" fill="#FAD5A5" stroke="#333" stroke-width="1.5" />
  <rect x="155" y="140" width="50" height="50" fill="#FAD5A5" stroke="#333" stroke-width="0.5" stroke-dasharray="2 2" />
  <rect x="160" y="145" width="40" height="40" fill="#FAD5A5" stroke="#333" stroke-width="0.5" stroke-dasharray="2 2" />
  <text x="180" y="115" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">卷积层</text>
  
  <!-- 第一个池化层 -->
  <rect x="260" y="145" width="40" height="40" fill="#C1E1C1" stroke="#333" stroke-width="1.5" />
  <rect x="265" y="150" width="30" height="30" fill="#C1E1C1" stroke="#333" stroke-width="0.5" stroke-dasharray="2 2" />
  <text x="280" y="125" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">池化层</text>
  
  <!-- 第二个卷积层 -->
  <rect x="350" y="140" width="50" height="50" fill="#FAD5A5" stroke="#333" stroke-width="1.5" />
  <rect x="355" y="145" width="40" height="40" fill="#FAD5A5" stroke="#333" stroke-width="0.5" stroke-dasharray="2 2" />
  <text x="375" y="120" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">卷积层</text>
  
  <!-- 第二个池化层 -->
  <rect x="450" y="145" width="30" height="30" fill="#C1E1C1" stroke="#333" stroke-width="1.5" />
  <text x="465" y="125" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">池化层</text>
  
  <!-- 展平操作 -->
  <rect x="530" y="155" width="50" height="10" fill="#D8BFD8" stroke="#333" stroke-width="1.5" />
  <text x="555" y="135" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">展平</text>
  
  <!-- 全连接层 -->
  <rect x="630" y="120" width="10" height="80" fill="#FFB6C1" stroke="#333" stroke-width="1.5" />
  <circle cx="630" cy="130" r="3" fill="#333" />
  <circle cx="630" cy="150" r="3" fill="#333" />
  <circle cx="630" cy="170" r="3" fill="#333" />
  <circle cx="630" cy="190" r="3" fill="#333" />
  <text x="630" y="100" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">全连接层</text>
  
  <!-- 输出层 -->
  <rect x="700" y="135" width="10" height="50" fill="#FFA07A" stroke="#333" stroke-width="1.5" />
  <circle cx="700" cy="145" r="3" fill="#333" />
  <circle cx="700" cy="160" r="3" fill="#333" />
  <circle cx="700" cy="175" r="3" fill="#333" />
  <text x="705" y="115" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">输出</text>
  
  <!-- 连接线 -->
  <line x1="100" y1="180" x2="150" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="210" y1="180" x2="260" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="300" y1="180" x2="350" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="400" y1="180" x2="450" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="480" y1="180" x2="530" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="580" y1="180" x2="630" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="640" y1="180" x2="700" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  
  <!-- 卷积操作示意 -->
  <rect x="90" y="260" width="120" height="120" fill="none" stroke="#333" stroke-width="1" />
  <rect x="110" y="280" width="40" height="40" fill="#FF9999" stroke="#333" stroke-width="1" opacity="0.7" />
  <text x="150" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">卷积操作</text>
  <text x="150" y="350" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">滑动窗口提取特征</text>
  
  <!-- 池化操作示意 -->
  <rect x="250" y="260" width="80" height="80" fill="none" stroke="#333" stroke-width="1" />
  <rect x="250" y="260" width="40" height="40" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="290" y="260" width="40" height="40" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="250" y="300" width="40" height="40" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="290" y="300" width="40" height="40" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="290" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">池化操作</text>
  <text x="290" y="350" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">降维、保留主要特征</text>
  
  <!-- 全连接示意 -->
  <line x1="420" y1="280" x2="470" y2="260" stroke="#333" stroke-width="1" />
  <line x1="420" y1="280" x2="470" y2="280" stroke="#333" stroke-width="1" />
  <line x1="420" y1="280" x2="470" y2="300" stroke="#333" stroke-width="1" />
  <line x1="420" y1="300" x2="470" y2="260" stroke="#333" stroke-width="1" />
  <line x1="420" y1="300" x2="470" y2="280" stroke="#333" stroke-width="1" />
  <line x1="420" y1="300" x2="470" y2="300" stroke="#333" stroke-width="1" />
  <circle cx="420" cy="280" r="3" fill="#333" />
  <circle cx="420" cy="300" r="3" fill="#333" />
  <circle cx="470" cy="260" r="3" fill="#333" />
  <circle cx="470" cy="280" r="3" fill="#333" />
  <circle cx="470" cy="300" r="3" fill="#333" />
  <text x="445" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">全连接层</text>
  <text x="445" y="350" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">组合高级特征进行分类</text>
</svg>
