<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f8f9fa" />
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#333">池化操作详细计算过程</text>
  
  <!-- 输入特征图 -->
  <rect x="50" y="70" width="200" height="200" fill="none" stroke="#333" stroke-width="1" />
  <text x="150" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">输入特征图 (4x4)</text>
  
  <!-- 输入特征图网格 -->
  <line x1="50" y1="120" x2="250" y2="120" stroke="#333" stroke-width="0.5" />
  <line x1="50" y1="170" x2="250" y2="170" stroke="#333" stroke-width="0.5" />
  <line x1="50" y1="220" x2="250" y2="220" stroke="#333" stroke-width="0.5" />
  
  <line x1="100" y1="70" x2="100" y2="270" stroke="#333" stroke-width="0.5" />
  <line x1="150" y1="70" x2="150" y2="270" stroke="#333" stroke-width="0.5" />
  <line x1="200" y1="70" x2="200" y2="270" stroke="#333" stroke-width="0.5" />
  
  <!-- 输入特征图数值 -->
  <text x="75" y="95" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">9</text>
  <text x="125" y="95" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">4</text>
  <text x="175" y="95" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">7</text>
  <text x="225" y="95" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">2</text>
  
  <text x="75" y="145" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">3</text>
  <text x="125" y="145" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">6</text>
  <text x="175" y="145" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  <text x="225" y="145" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">5</text>
  
  <text x="75" y="195" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">8</text>
  <text x="125" y="195" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">10</text>
  <text x="175" y="195" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">2</text>
  <text x="225" y="195" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">4</text>
  
  <text x="75" y="245" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">5</text>
  <text x="125" y="245" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">3</text>
  <text x="175" y="245" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">7</text>
  <text x="225" y="245" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  
  <!-- 最大池化过程 -->
  <rect x="300" y="70" width="250" height="200" fill="none" stroke="#333" stroke-width="1" />
  <text x="425" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">最大池化过程 (2x2 窗口, 步长=2)</text>
  
  <!-- 最大池化窗口1 -->
  <rect x="320" y="90" width="100" height="100" fill="#A7C7E7" fill-opacity="0.3" stroke="#1E90FF" stroke-width="1.5" stroke-dasharray="5,3" />
  <text x="370" y="95" text-anchor="middle" font-family="Arial" font-size="12" fill="#1E90FF">窗口1</text>
  
  <text x="340" y="115" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">9</text>
  <text x="380" y="115" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">4</text>
  <text x="340" y="155" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">3</text>
  <text x="380" y="155" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">6</text>
  
  <circle cx="340" cy="115" r="15" fill="none" stroke="#FF0000" stroke-width="1.5" />
  <text x="340" y="180" text-anchor="middle" font-family="Arial" font-size="14" fill="#FF0000">最大值 = 9</text>
  
  <!-- 最大池化窗口2 -->
  <rect x="430" y="90" width="100" height="100" fill="#A7C7E7" fill-opacity="0.3" stroke="#1E90FF" stroke-width="1.5" stroke-dasharray="5,3" />
  <text x="480" y="95" text-anchor="middle" font-family="Arial" font-size="12" fill="#1E90FF">窗口2</text>
  
  <text x="450" y="115" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">7</text>
  <text x="490" y="115" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">2</text>
  <text x="450" y="155" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  <text x="490" y="155" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">5</text>
  
  <circle cx="450" cy="115" r="15" fill="none" stroke="#FF0000" stroke-width="1.5" />
  <text x="450" y="180" text-anchor="middle" font-family="Arial" font-size="14" fill="#FF0000">最大值 = 7</text>
  
  <!-- 最大池化窗口3 -->
  <rect x="320" y="200" width="100" height="100" fill="#A7C7E7" fill-opacity="0.3" stroke="#1E90FF" stroke-width="1.5" stroke-dasharray="5,3" />
  <text x="370" y="205" text-anchor="middle" font-family="Arial" font-size="12" fill="#1E90FF">窗口3</text>
  
  <text x="340" y="225" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">8</text>
  <text x="380" y="225" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">10</text>
  <text x="340" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">5</text>
  <text x="380" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">3</text>
  
  <circle cx="380" cy="225" r="15" fill="none" stroke="#FF0000" stroke-width="1.5" />
  <text x="380" y="290" text-anchor="middle" font-family="Arial" font-size="14" fill="#FF0000">最大值 = 10</text>
  
  <!-- 最大池化窗口4 -->
  <rect x="430" y="200" width="100" height="100" fill="#A7C7E7" fill-opacity="0.3" stroke="#1E90FF" stroke-width="1.5" stroke-dasharray="5,3" />
  <text x="480" y="205" text-anchor="middle" font-family="Arial" font-size="12" fill="#1E90FF">窗口4</text>
  
  <text x="450" y="225" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">2</text>
  <text x="490" y="225" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">4</text>
  <text x="450" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">7</text>
  <text x="490" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1</text>
  
  <circle cx="450" cy="265" r="15" fill="none" stroke="#FF0000" stroke-width="1.5" />
  <text x="480" y="290" text-anchor="middle" font-family="Arial" font-size="14" fill="#FF0000">最大值 = 7</text>
  
  <!-- 输出特征图 -->
  <rect x="600" y="125" width="100" height="100" fill="none" stroke="#333" stroke-width="1" />
  <text x="650" y="115" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">输出特征图 (2x2)</text>
  
  <!-- 输出特征图网格 -->
  <line x1="600" y1="175" x2="700" y2="175" stroke="#333" stroke-width="0.5" />
  <line x1="650" y1="125" x2="650" y2="225" stroke="#333" stroke-width="0.5" />
  
  <!-- 输出特征图数值 -->
  <text x="625" y="150" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">9</text>
  <text x="675" y="150" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">7</text>
  <text x="625" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">10</text>
  <text x="675" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">7</text>
  
  <!-- 箭头 -->
  <line x1="260" y1="170" x2="290" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="560" y1="170" x2="590" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  
  <!-- 平均池化示例 -->
  <rect x="100" y="320" width="600" height="160" fill="#e9ecef" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="340" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">平均池化示例</text>
  
  <!-- 输入区域 -->
  <rect x="150" y="360" width="100" height="100" fill="none" stroke="#333" stroke-width="1" />
  <text x="200" y="355" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">输入区域</text>
  
  <!-- 输入区域网格 -->
  <line x1="150" y1="410" x2="250" y2="410" stroke="#333" stroke-width="0.5" />
  <line x1="200" y1="360" x2="200" y2="460" stroke="#333" stroke-width="0.5" />
  
  <!-- 输入区域数值 -->
  <text x="175" y="385" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">9</text>
  <text x="225" y="385" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">4</text>
  <text x="175" y="435" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">3</text>
  <text x="225" y="435" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">6</text>
  
  <!-- 计算公式 -->
  <text x="300" y="410" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">平均池化计算:</text>
  <text x="450" y="385" text-anchor="start" font-family="Arial" font-size="14" fill="#333">9 + 4 + 3 + 6 = 22</text>
  <text x="450" y="410" text-anchor="start" font-family="Arial" font-size="14" fill="#333">22 ÷ 4 = 5.5</text>
  <text x="450" y="435" text-anchor="start" font-family="Arial" font-size="14" fill="#333">输出值 = 5.5</text>
  
  <!-- 输出结果 -->
  <rect x="580" y="390" width="40" height="40" fill="none" stroke="#333" stroke-width="1.5" />
  <text x="600" y="380" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">输出</text>
  <text x="600" y="415" text-anchor="middle" font-family="Arial" font-size="14" fill="#FF0000" font-weight="bold">5.5</text>
</svg>
