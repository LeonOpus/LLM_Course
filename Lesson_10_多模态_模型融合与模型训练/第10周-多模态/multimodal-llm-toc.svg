<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="80" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#2d3e50" text-anchor="middle">多模态LLM系统开发课程</text>
  
  <!-- Subtitle -->
  <text x="500" y="120" font-family="Arial, sans-serif" font-size="20" fill="#34495e" text-anchor="middle">图片转化为文本表达 · 模型理解是基础</text>
  
  <!-- Horizontal Line -->
  <line x1="200" y1="150" x2="800" y2="150" stroke="#34495e" stroke-width="2"/>
  
  <!-- Table of Contents Heading -->
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2d3e50">课程目录</text>
  
  <!-- Content Items -->
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2980b9">1. 卷积神经网络</text>
  <line x1="200" y1="245" x2="350" y2="245" stroke="#2980b9" stroke-width="2"/>
  
  <text x="200" y="290" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2980b9">2. ViT</text>
  <line x1="200" y1="295" x2="240" y2="295" stroke="#2980b9" stroke-width="2"/>
  
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2980b9">3. CLIP</text>
  <line x1="200" y1="345" x2="250" y2="345" stroke="#2980b9" stroke-width="2"/>
  
  <text x="200" y="390" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2980b9">4. BLIP</text>
  <line x1="200" y1="395" x2="250" y2="395" stroke="#2980b9" stroke-width="2"/>
  
  <text x="200" y="440" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2980b9">5. BLIP-2</text>
  <line x1="200" y1="445" x2="270" y2="445" stroke="#2980b9" stroke-width="2"/>
  
  <text x="200" y="490" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2980b9">6. LLaVA</text>
  <line x1="200" y1="495" x2="260" y2="495" stroke="#2980b9" stroke-width="2"/>
  
  <!-- Diagram -->
  <rect x="650" y="240" width="240" height="240" fill="#ecf0f1" stroke="#34495e" stroke-width="2" rx="10"/>
  
  <!-- Diagram Inner Elements -->
  <circle cx="700" cy="290" r="30" fill="#ffffff" stroke="#2980b9" stroke-width="2"/>
  <text x="700" y="295" font-family="Arial, sans-serif" font-size="14" fill="#2980b9" text-anchor="middle">ViT</text>
  
  <circle cx="840" cy="290" r="30" fill="#ffffff" stroke="#2980b9" stroke-width="2"/>
  <text x="840" y="295" font-family="Arial, sans-serif" font-size="14" fill="#2980b9" text-anchor="middle">BERT</text>
  
  <circle cx="770" cy="360" r="30" fill="#ffffff" stroke="#2980b9" stroke-width="2"/>
  <text x="770" y="365" font-family="Arial, sans-serif" font-size="14" fill="#2980b9" text-anchor="middle">CLIP</text>
  
  <circle cx="770" cy="430" r="30" fill="#ffffff" stroke="#2980b9" stroke-width="2"/>
  <text x="770" y="435" font-family="Arial, sans-serif" font-size="14" fill="#2980b9" text-anchor="middle">LLM</text>
  
  <!-- Connection Lines -->
  <line x1="718" y1="308" x2="752" y2="342" stroke="#34495e" stroke-width="1.5"/>
  <line x1="788" y1="342" x2="822" y2="308" stroke="#34495e" stroke-width="1.5"/>
  <line x1="770" y1="390" x2="770" y2="400" stroke="#34495e" stroke-width="1.5"/>
  
  <!-- Additional Elements -->
  <rect x="680" y="200" width="90" height="30" fill="#3498db" rx="5"/>
  <text x="725" y="220" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">视觉模型</text>
  
  <rect x="770" y="480" width="90" height="30" fill="#3498db" rx="5"/>
  <text x="815" y="500" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">文本理解</text>
</svg>
