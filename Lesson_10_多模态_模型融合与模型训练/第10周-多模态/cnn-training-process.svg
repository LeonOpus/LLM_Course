<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- 背景 -->
  <rect width="900" height="600" fill="#f8f9fa" />
  
  <!-- 标题 -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#333">卷积神经网络训练过程</text>
  
  <!-- 网络架构 - 简化表示 -->
  <rect x="50" y="80" width="800" height="180" fill="none" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="450" y="70" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">简化CNN架构</text>
  
  <!-- 输入层 -->
  <rect x="80" y="120" width="60" height="60" fill="#A7C7E7" stroke="#333" stroke-width="1.5" />
  <text x="110" y="110" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">输入图像</text>
  
  <!-- 卷积层 -->
  <rect x="190" y="110" width="80" height="80" fill="#FAD5A5" stroke="#333" stroke-width="1.5" />
  <text x="230" y="100" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">卷积层</text>
  <text x="230" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">权重 W₁</text>
  
  <!-- 池化层 -->
  <rect x="320" y="120" width="60" height="60" fill="#C1E1C1" stroke="#333" stroke-width="1.5" />
  <text x="350" y="110" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">池化层</text>
  
  <!-- 展平层 -->
  <rect x="430" y="135" width="60" height="30" fill="#D8BFD8" stroke="#333" stroke-width="1.5" />
  <text x="460" y="125" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">展平</text>
  
  <!-- 全连接层 -->
  <rect x="540" y="120" width="60" height="60" fill="#FFB6C1" stroke="#333" stroke-width="1.5" />
  <text x="570" y="110" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">全连接层</text>
  <text x="570" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">权重 W₂</text>
  
  <!-- 输出层 -->
  <rect x="650" y="130" width="40" height="40" fill="#FFA07A" stroke="#333" stroke-width="1.5" />
  <text x="670" y="120" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">输出</text>
  <text x="670" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">ŷ</text>
  
  <!-- 真实标签 -->
  <rect x="740" y="130" width="40" height="40" fill="#98FB98" stroke="#333" stroke-width="1.5" />
  <text x="760" y="120" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">真实标签</text>
  <text x="760" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">y</text>
  
  <!-- 损失函数 -->
  <rect x="690" y="210" width="100" height="30" fill="#FFD700" fill-opacity="0.5" stroke="#333" stroke-width="1.5" rx="15" ry="15" />
  <text x="740" y="230" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">损失函数 L(ŷ,y)</text>
  
  <!-- 前向传播箭头 -->
  <line x1="140" y1="150" x2="190" y2="150" stroke="#3366CC" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="270" y1="150" x2="320" y2="150" stroke="#3366CC" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="380" y1="150" x2="430" y2="150" stroke="#3366CC" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="490" y1="150" x2="540" y2="150" stroke="#3366CC" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="600" y1="150" x2="650" y2="150" stroke="#3366CC" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="690" y1="150" x2="740" y2="150" stroke="#3366CC" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="760" y1="170" x2="760" y2="210" stroke="#3366CC" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="670" y1="170" x2="700" y2="210" stroke="#3366CC" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- 前向传播标签 -->
  <text x="170" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#3366CC">前向传播</text>
  
  <!-- 反向传播箭头 -->
  <line x1="740" y1="240" x2="740" y2="280" stroke="#CC3366" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="670" y1="270" x2="190" y2="270" stroke="#CC3366" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="570" y1="240" x2="570" y2="270" stroke="#CC3366" stroke-width="2" stroke-dasharray="5,3" />
  <line x1="230" y1="240" x2="230" y2="270" stroke="#CC3366" stroke-width="2" stroke-dasharray="5,3" />
  
  <!-- 反向传播标签 -->
  <text x="450" y="260" text-anchor="middle" font-family="Arial" font-size="10" fill="#CC3366">反向传播: 计算梯度并更新权重</text>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L10,5 z" fill="#333" />
    </marker>
  </defs>
  
  <!-- 训练过程部分 -->
  <rect x="50" y="300" width="800" height="280" fill="none" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="450" y="290" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">训练过程详解</text>
  
  <!-- 步骤1: 初始化 -->
  <rect x="80" y="320" width="160" height="80" fill="#e9ecef" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="160" y="340" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">1. 初始化参数</text>
  <text x="160" y="360" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="90">· 随机初始化权重</text>
  <text x="160" y="380" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="90">· 设置偏置项为0</text>
  <text x="160" y="400" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="90">· 初始化学习率</text>
  
  <!-- 步骤2: 前向传播 -->
  <rect x="270" y="320" width="160" height="120" fill="#e9ecef" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="350" y="340" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">2. 前向传播</text>
  <text x="350" y="360" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="280">· 输入数据通过卷积层</text>
  <text x="350" y="380" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="280">· 应用激活函数</text>
  <text x="350" y="400" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="280">· 通过池化层</text>
  <text x="350" y="420" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="280">· 展平后通过全连接层</text>
  <text x="350" y="440" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="280">· 计算预测输出 ŷ</text>
  
  <!-- 步骤3: 计算损失 -->
  <rect x="460" y="320" width="160" height="80" fill="#e9ecef" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="540" y="340" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">3. 计算损失</text>
  <text x="540" y="360" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="470">· 比较预测值与真实值</text>
  <text x="540" y="380" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="470">· 计算损失函数值</text>
  <text x="540" y="400" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="470">· 如交叉熵损失</text>
  
  <!-- 步骤4: 反向传播 -->
  <rect x="650" y="320" width="160" height="120" fill="#e9ecef" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="730" y="340" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">4. 反向传播</text>
  <text x="730" y="360" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="660">· 计算损失对各参数的梯度</text>
  <text x="730" y="380" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="660">· 使用链式法则向后传播</text>
  <text x="730" y="400" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="660">· 计算 ∂L/∂W₂, ∂L/∂W₁</text>
  <text x="730" y="420" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="660">· 使用梯度更新参数</text>
  <text x="730" y="440" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="660">· W = W - η·∂L/∂W</text>
  
  <!-- 步骤5: 迭代 -->
  <rect x="270" y="460" width="160" height="100" fill="#e9ecef" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="350" y="480" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">5. 迭代训练</text>
  <text x="350" y="500" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="280">· 重复步骤2-4</text>
  <text x="350" y="520" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="280">· 使用小批量数据(batch)</text>
  <text x="350" y="540" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="280">· 完成所有批次为一个epoch</text>
  <text x="350" y="560" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="280">· 训练多个epoch直至收敛</text>
  
  <!-- 优化算法 -->
  <rect x="460" y="460" width="160" height="100" fill="#e9ecef" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="540" y="480" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">6. 优化技巧</text>
  <text x="540" y="500" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="470">· 学习率调整(lr decay)</text>
  <text x="540" y="520" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="470">· 动量(Momentum)</text>
  <text x="540" y="540" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="470">· Adam, RMSprop等优化器</text>
  <text x="540" y="560" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="470">· 正则化(Dropout, L2等)</text>
  
  <!-- 参数更新公式 -->
  <rect x="80" y="430" width="160" height="130" fill="#FFF8DC" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="160" y="450" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">参数更新公式</text>
  
  <text x="160" y="480" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="90">梯度下降:</text>
  <text x="160" y="500" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="90">W = W - η · ∇W</text>
  
  <text x="160" y="520" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="90">带动量:</text>
  <text x="160" y="540" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="90">v = β·v - η · ∇W</text>
  <text x="160" y="560" text-anchor="start" font-family="Arial" font-size="12" fill="#333" x="90">W = W + v</text>
  
  <!-- 损失曲线 -->
  <rect x="650" y="460" width="160" height="100" fill="#e9ecef" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="730" y="480" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">训练过程监控</text>
  
  <!-- 简单的损失曲线 -->
  <polyline points="670,530 680,520 690,510 700,505 710,500 720,495 730,493 740,492 750,490 760,489 770,488" 
            fill="none" stroke="#CC3366" stroke-width="2" />
  <polyline points="670,520 680,525 690,515 700,518 710,510 720,508 730,503 740,507 750,500 760,499 770,496" 
            fill="none" stroke="#3366CC" stroke-width="2" stroke-dasharray="3,2" />
  
  <text x="730" y="545" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">训练轮次 (Epochs)</text>
  <text x="665" y="510" text-anchor="middle" font-family="Arial" font-size="10" fill="#333" transform="rotate(-90,665,510)">损失值</text>
  
  <text x="750" y="550" text-anchor="start" font-family="Arial" font-size="10" fill="#CC3366">训练损失</text>
  <text x="750" y="565" text-anchor="start" font-family="Arial" font-size="10" fill="#3366CC">验证损失</text>
  <line x1="740" y1="550" x2="746" y2="550" stroke="#CC3366" stroke-width="2" />
  <line x1="740" y1="565" x2="746" y2="565" stroke="#3366CC" stroke-width="2" stroke-dasharray="3,2" />
</svg>
