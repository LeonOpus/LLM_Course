<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="white"/>
  
  <!-- Header section with title -->
  <rect x="150" y="20" width="500" height="60" rx="5" ry="5" fill="#1e3a5f"/>
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" dominant-baseline="middle">结论</text>
  
  <!-- Decorative wavy lines like in the reference -->
  <path d="M150 100 Q 170 90, 190 100 Q 210 110, 230 100 Q 250 90, 270 100" stroke="#4b89dc" fill="none" stroke-width="2"/>
  <path d="M530 460 Q 550 450, 570 460 Q 590 470, 610 460 Q 630 450, 650 460" stroke="#4b89dc" fill="none" stroke-width="2"/>
  
  <!-- Conclusion 1 -->
  <rect x="100" y="130" width="600" height="90" rx="5" ry="5" fill="#e8f4fc" stroke="#1e3a5f" stroke-width="1"/>
  <text x="120" y="170" font-family="Arial, sans-serif" font-size="18" fill="#1e3a5f" text-anchor="start" dominant-baseline="middle">1. Transformer模型可以不做改动来解决计算机视觉问题。</text>
  <circle cx="110" cy="170" r="12" fill="#3399ff" opacity="0.7"/>
  <text x="110" y="170" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" dominant-baseline="middle">1</text>
  
  <!-- Conclusion 2 -->
  <rect x="100" y="240" width="600" height="90" rx="5" ry="5" fill="#e8f4fc" stroke="#1e3a5f" stroke-width="1"/>
  <text x="120" y="265" font-family="Arial, sans-serif" font-size="18" fill="#1e3a5f" text-anchor="start" dominant-baseline="middle">2. 小规模数据上略输卷积神经网络；</text>
  <text x="120" y="295" font-family="Arial, sans-serif" font-size="18" fill="#1e3a5f" text-anchor="start" dominant-baseline="middle">   中等或者大规模数据集上，表现相当于或者优于卷积神经网络。</text>
  <circle cx="110" cy="280" r="12" fill="#3399ff" opacity="0.7"/>
  <text x="110" y="280" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" dominant-baseline="middle">2</text>
  
  <!-- Conclusion 3 -->
  <rect x="100" y="350" width="600" height="90" rx="5" ry="5" fill="#e8f4fc" stroke="#1e3a5f" stroke-width="1"/>
  <text x="120" y="390" font-family="Arial, sans-serif" font-size="18" fill="#1e3a5f" text-anchor="start" dominant-baseline="middle">3. 在计算效率上，训练同等精度的模型，Transformer模型比</text>
  <text x="120" y="420" font-family="Arial, sans-serif" font-size="18" fill="#1e3a5f" text-anchor="start" dominant-baseline="middle">   卷积神经网络模型更有优势。</text>
  <circle cx="110" cy="390" r="12" fill="#3399ff" opacity="0.7"/>
  <text x="110" y="390" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" dominant-baseline="middle">3</text>
  
  <!-- Horizontal line at bottom -->
  <line x1="150" y1="470" x2="650" y2="470" stroke="#333" stroke-width="1"/>
</svg>
