<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#333">卷积神经网络中的展平和全连接过程</text>
  
  <!-- 池化后的特征图 -->
  <rect x="50" y="100" width="120" height="120" fill="#A7C7E7" fill-opacity="0.5" stroke="#333" stroke-width="1.5" />
  <text x="110" y="90" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">池化后特征图</text>
  <text x="110" y="250" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(2x2x3 = 12个特征)</text>
  
  <!-- 池化后的特征图网格 - 三个通道 -->
  <!-- 通道1 -->
  <rect x="60" y="110" width="40" height="40" fill="#FF9999" fill-opacity="0.5" stroke="#333" stroke-width="1" />
  <rect x="100" y="110" width="40" height="40" fill="#FF9999" fill-opacity="0.5" stroke="#333" stroke-width="1" />
  <rect x="60" y="150" width="40" height="40" fill="#FF9999" fill-opacity="0.5" stroke="#333" stroke-width="1" />
  <rect x="100" y="150" width="40" height="40" fill="#FF9999" fill-opacity="0.5" stroke="#333" stroke-width="1" />
  
  <!-- 通道1数值 -->
  <text x="80" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">9</text>
  <text x="120" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">7</text>
  <text x="80" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">10</text>
  <text x="120" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">7</text>
  
  <!-- 通道标签 -->
  <text x="45" y="135" text-anchor="end" font-family="Arial" font-size="10" fill="#333">通道1</text>
  
  <!-- 通道2 - 放在通道1下面 -->
  <rect x="60" y="200" width="40" height="40" fill="#99CC99" fill-opacity="0.5" stroke="#333" stroke-width="1" />
  <rect x="100" y="200" width="40" height="40" fill="#99CC99" fill-opacity="0.5" stroke="#333" stroke-width="1" />
  
  <!-- 通道2数值 -->
  <text x="80" y="220" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">5</text>
  <text x="120" y="220" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">8</text>
  
  <!-- 通道标签 -->
  <text x="45" y="220" text-anchor="end" font-family="Arial" font-size="10" fill="#333">通道2</text>
  
  <!-- 通道3 - 放在通道2旁边 -->
  <rect x="150" y="200" width="40" height="40" fill="#9999FF" fill-opacity="0.5" stroke="#333" stroke-width="1" />
  <rect x="190" y="200" width="40" height="40" fill="#9999FF" fill-opacity="0.5" stroke="#333" stroke-width="1" />
  
  <!-- 通道3数值 -->
  <text x="170" y="220" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">3</text>
  <text x="210" y="220" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">6</text>
  
  <!-- 通道标签 -->
  <text x="190" y="250" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">通道3</text>
  
  <!-- 展平过程图示 -->
  <rect x="320" y="140" width="160" height="40" fill="#FFD700" fill-opacity="0.4" stroke="#333" stroke-width="1.5" />
  <text x="400" y="130" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">展平操作 (Flatten)</text>
  
  <!-- 展平后的元素 -->
  <rect x="320" y="140" width="20" height="40" fill="#FF9999" fill-opacity="0.5" stroke="#333" stroke-width="0.5" />
  <rect x="340" y="140" width="20" height="40" fill="#FF9999" fill-opacity="0.5" stroke="#333" stroke-width="0.5" />
  <rect x="360" y="140" width="20" height="40" fill="#FF9999" fill-opacity="0.5" stroke="#333" stroke-width="0.5" />
  <rect x="380" y="140" width="20" height="40" fill="#FF9999" fill-opacity="0.5" stroke="#333" stroke-width="0.5" />
  
  <rect x="400" y="140" width="20" height="40" fill="#99CC99" fill-opacity="0.5" stroke="#333" stroke-width="0.5" />
  <rect x="420" y="140" width="20" height="40" fill="#99CC99" fill-opacity="0.5" stroke="#333" stroke-width="0.5" />
  
  <rect x="440" y="140" width="20" height="40" fill="#9999FF" fill-opacity="0.5" stroke="#333" stroke-width="0.5" />
  <rect x="460" y="140" width="20" height="40" fill="#9999FF" fill-opacity="0.5" stroke="#333" stroke-width="0.5" />
  
  <!-- 展平后的值 -->
  <text x="330" y="165" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">9</text>
  <text x="350" y="165" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">7</text>
  <text x="370" y="165" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">10</text>
  <text x="390" y="165" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">7</text>
  <text x="410" y="165" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">5</text>
  <text x="430" y="165" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">8</text>
  <text x="450" y="165" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">3</text>
  <text x="470" y="165" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">6</text>
  
  <!-- 索引标注 -->
  <text x="330" y="190" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₁</text>
  <text x="350" y="190" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₂</text>
  <text x="370" y="190" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₃</text>
  <text x="390" y="190" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₄</text>
  <text x="410" y="190" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₅</text>
  <text x="430" y="190" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₆</text>
  <text x="450" y="190" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₇</text>
  <text x="470" y="190" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₈</text>
  
  <!-- 第一个全连接层 -->
  <rect x="320" y="250" width="160" height="100" fill="none" stroke="#333" stroke-width="1" />
  <text x="400" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">全连接层 (Fully Connected)</text>
  
  <!-- 输入节点 -->
  <circle cx="330" y="270" r="5" fill="#333" />
  <circle cx="350" y="270" r="5" fill="#333" />
  <circle cx="370" y="270" r="5" fill="#333" />
  <circle cx="390" y="270" r="5" fill="#333" />
  <circle cx="410" y="270" r="5" fill="#333" />
  <circle cx="430" y="270" r="5" fill="#333" />
  <circle cx="450" y="270" r="5" fill="#333" />
  <circle cx="470" y="270" r="5" fill="#333" />
  
  <!-- 输入标签 -->
  <text x="330" y="260" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₁</text>
  <text x="350" y="260" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₂</text>
  <text x="370" y="260" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₃</text>
  <text x="390" y="260" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₄</text>
  <text x="410" y="260" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₅</text>
  <text x="430" y="260" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₆</text>
  <text x="450" y="260" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₇</text>
  <text x="470" y="260" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">x₈</text>
  
  <!-- 隐藏层节点 -->
  <circle cx="350" y="320" r="8" fill="#FF9999" />
  <circle cx="400" y="320" r="8" fill="#FF9999" />
  <circle cx="450" y="320" r="8" fill="#FF9999" />
  
  <!-- 隐藏层标签 -->
  <text x="350" y="340" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">h₁</text>
  <text x="400" y="340" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">h₂</text>
  <text x="450" y="340" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">h₃</text>
  
  <!-- 连接线-简化表示 -->
  <line x1="330" y1="270" x2="350" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  <line x1="350" y1="270" x2="350" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  <line x1="370" y1="270" x2="350" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  <line x1="390" y1="270" x2="350" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  
  <line x1="330" y1="270" x2="400" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  <line x1="350" y1="270" x2="400" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  <line x1="370" y1="270" x2="400" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  <line x1="390" y1="270" x2="400" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  
  <line x1="410" y1="270" x2="400" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  <line x1="430" y1="270" x2="400" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  <line x1="450" y1="270" x2="400" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  <line x1="470" y1="270" x2="400" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  
  <line x1="410" y1="270" x2="450" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  <line x1="430" y1="270" x2="450" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  <line x1="450" y1="270" x2="450" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  <line x1="470" y1="270" x2="450" y2="320" stroke="#333" stroke-width="0.5" stroke-opacity="0.5" />
  
  <!-- 第二个全连接层/输出层 -->
  <rect x="320" y="380" width="160" height="70" fill="none" stroke="#333" stroke-width="1" />
  <text x="400" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">输出层</text>
  
  <!-- 隐藏层节点-复制 -->
  <circle cx="350" y="400" r="8" fill="#FF9999" />
  <circle cx="400" y="400" r="8" fill="#FF9999" />
  <circle cx="450" y="400" r="8" fill="#FF9999" />
  
  <!-- 输出层节点 -->
  <circle cx="380" y="440" r="10" fill="#FFD700" />
  <circle cx="420" y="440" r="10" fill="#FFD700" />
  
  <!-- 输出层标签 -->
  <text x="380" y="460" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">y₁</text>
  <text x="420" y="460" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">y₂</text>
  
  <!-- 连接线 -->
  <line x1="350" y1="400" x2="380" y2="440" stroke="#333" stroke-width="0.5" />
  <line x1="400" y1="400" x2="380" y2="440" stroke="#333" stroke-width="0.5" />
  <line x1="450" y1="400" x2="380" y2="440" stroke="#333" stroke-width="0.5" />
  
  <line x1="350" y1="400" x2="420" y2="440" stroke="#333" stroke-width="0.5" />
  <line x1="400" y1="400" x2="420" y2="440" stroke="#333" stroke-width="0.5" />
  <line x1="450" y1="400" x2="420" y2="440" stroke="#333" stroke-width="0.5" />
  
  <!-- 箭头 -->
  <line x1="200" y1="160" x2="310" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="400" y1="190" x2="400" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="400" y1="350" x2="400" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  
  <!-- 全连接计算示例 -->
  <rect x="580" y="100" width="200" height="200" fill="#e9ecef" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="680" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">全连接层计算示例</text>
  
  <!-- 描述 -->
  <text x="590" y="150" text-anchor="start" font-family="Arial" font-size="12" fill="#333">输入: x = [9, 7, 10, 7, 5, 8, 3, 6]</text>
  <text x="590" y="175" text-anchor="start" font-family="Arial" font-size="12" fill="#333">权重: w₁ = [0.1, 0.2, 0.3, -0.1, 0.5, -0.2, 0.1, 0.4]</text>
  <text x="590" y="200" text-anchor="start" font-family="Arial" font-size="12" fill="#333">偏置: b₁ = 1.0</text>
  
  <text x="590" y="225" text-anchor="start" font-family="Arial" font-size="12" fill="#333">计算:</text>
  <text x="590" y="245" text-anchor="start" font-family="Arial" font-size="12" fill="#333">h₁ = Σ(x_i × w₁_i) + b₁</text>
  <text x="590" y="265" text-anchor="start" font-family="Arial" font-size="12" fill="#333">= 9×0.1 + 7×0.2 + 10×0.3 + ... + 6×0.4 + 1.0</text>
  <text x="590" y="285" text-anchor="start" font-family="Arial" font-size="12" fill="#333">= 0.9 + 1.4 + 3.0 + ... + 2.4 + 1.0</text>
  <text x="640" y="285" text-anchor="middle" font-family="Arial" font-size="12" fill="#333" font-weight="bold">=</text>
  <text x="690" y="285" text-anchor="middle" font-family="Arial" font-size="12" fill="#FF0000" font-weight="bold">12.2</text>

  <!-- 激活函数 -->
  <rect x="580" y="310" width="200" height="120" fill="#e9ecef" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="680" y="330" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">激活函数 (ReLU)</text>
  
  <text x="590" y="360" text-anchor="start" font-family="Arial" font-size="12" fill="#333">ReLU(x) = max(0, x)</text>
  <text x="590" y="385" text-anchor="start" font-family="Arial" font-size="12" fill="#333">ReLU(12.2) = 12.2</text>
  <text x="590" y="410" text-anchor="start" font-family="Arial" font-size="12" fill="#333">最终输出: h₁ = 12.2</text>
  
  <!-- Softmax输出层 -->
  <rect x="580" y="440" width="200" height="140" fill="#e9ecef" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="680" y="460" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Softmax输出层</text>
  
  <text x="590" y="485" text-anchor="start" font-family="Arial" font-size="12" fill="#333">假设最终输出层值为:</text>
  <text x="590" y="505" text-anchor="start" font-family="Arial" font-size="12" fill="#333">z = [2.5, 1.8]</text>
  
  <text x="590" y="530" text-anchor="start" font-family="Arial" font-size="12" fill="#333">Softmax(z₁) = e^2.5 / (e^2.5 + e^1.8) ≈ 0.66</text>
  <text x="590" y="550" text-anchor="start" font-family="Arial" font-size="12" fill="#333">Softmax(z₂) = e^1.8 / (e^2.5 + e^1.8) ≈ 0.34</text>
  
  <text x="590" y="575" text-anchor="start" font-family="Arial" font-size="12" fill="#333">类别1概率: 66%, 类别2概率: 34%</text>
</svg>
