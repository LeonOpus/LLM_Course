<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f5f5f5" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle">LLaVA 核心组件</text>
  
  <!-- Main Circle -->
  <circle cx="400" cy="250" r="180" fill="#e1f5fe" stroke="#2196f3" stroke-width="3"/>
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#0d47a1">LLaVA</text>
  
  <!-- Component 1: Data Augmentation -->
  <circle cx="280" cy="250" r="120" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="280" y="230" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1b5e20">数据增强</text>
  
  <!-- Component 1 Details -->
  <text x="280" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">多模态数据处理</text>
  <text x="280" y="290" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">图像-文本对齐</text>
  
  <!-- Component 2: Model Architecture -->
  <circle cx="520" cy="250" r="120" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="520" y="230" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#e65100">模型架构</text>
  
  <!-- Component 2 Details -->
  <text x="520" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">视觉编码器</text>
  <text x="520" y="290" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">多模态连接层</text>
  
  <!-- Connection Lines -->
  <path d="M400,150 C370,170 330,170 300,150" stroke="#2196f3" stroke-width="2" fill="none"/>
  <path d="M400,150 C430,170 470,170 500,150" stroke="#2196f3" stroke-width="2" fill="none"/>
  
  <!-- Legend at bottom -->
  <rect x="280" y="400" width="240" height="60" rx="10" ry="10" fill="white" stroke="#757575" stroke-width="1"/>
  <text x="400" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">LLaVA的核心在于2点:</text>
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">数据增强，模型架构</text>
</svg>
