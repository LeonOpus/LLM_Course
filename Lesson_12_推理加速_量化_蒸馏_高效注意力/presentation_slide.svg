<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark blue background -->
  <rect width="800" height="600" fill="#101c33"/>
  
  <!-- Title text -->
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">第十二周：推理/训练加速</text>
  
  <!-- Horizontal line under the title -->
  <line x1="250" y1="310" x2="550" y2="310" stroke="#4cd7bd" stroke-width="2"/>
  
  <!-- Circle with cross -->
  <circle cx="400" cy="450" r="80" fill="none" stroke="#4cd7bd" stroke-width="2"/>
  <line x1="320" y1="450" x2="480" y2="450" stroke="#4cd7bd" stroke-width="2"/>
  <line x1="400" y1="370" x2="400" y2="530" stroke="#4cd7bd" stroke-width="2"/>
  
  <!-- Text in the center of the circle -->
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">加速</text>
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">吞吐</text>
  
  <!-- Slogan text -->
  <text x="400" y="640" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle">提升推理/训练速度，加大吞吐量</text>
  
  <!-- Horizontal line under the slogan -->
  <line x1="250" y1="670" x2="550" y2="670" stroke="#4cd7bd" stroke-width="2"/>
</svg>