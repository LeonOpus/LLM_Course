<svg viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background -->
  <rect x="0" y="0" width="800" height="150" fill="white"/>
  
  <!-- Boxes -->
  <!-- int8 weight -->
  <rect x="120" y="20" width="110" height="40" rx="5" fill="#5b8cdc" />
  <text x="175" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16">int8权重</text>
  
  <!-- int8 input -->
  <rect x="120" y="90" width="110" height="40" rx="5" fill="#5b8cdc" />
  <text x="175" y="115" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16">int8输入</text>
  
  <!-- int8 calculation -->
  <rect x="320" y="55" width="110" height="40" rx="5" fill="#5b8cdc" />
  <text x="375" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16">int8计算</text>
  
  <!-- Dequantization/Quantization -->
  <rect x="480" y="55" width="140" height="40" rx="5" fill="#d4803b" />
  <text x="550" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16">反量化+量化</text>
  
  <!-- int8 output -->
  <rect x="670" y="55" width="110" height="40" rx="5" fill="#5b8cdc" />
  <text x="725" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16">int8输出</text>
  
  <!-- Arrow to the right -->
  <line x1="780" y1="75" x2="800" y2="75" stroke="black" stroke-width="2" />
  <polygon points="798,71 800,75 798,79" fill="black" />
  
  <!-- Arrow to the left -->
  <line x1="0" y1="110" x2="120" y2="110" stroke="black" stroke-width="2" />
  <polygon points="118,106 128,110 118,114" fill="black" />
  
  <!-- Arrows -->
  <!-- int8 weight to int8 calculation -->
  <line x1="230" y1="40" x2="290" y2="40" stroke="black" stroke-width="2" />
  <line x1="290" y1="40" x2="320" y2="60" stroke="black" stroke-width="2" />
  <polygon points="318,56 328,64 320,66" fill="black" />
  
  <!-- int8 input to int8 calculation -->
  <line x1="230" y1="110" x2="290" y2="110" stroke="black" stroke-width="2" />
  <line x1="290" y1="110" x2="320" y2="90" stroke="black" stroke-width="2" />
  <polygon points="318,94 328,86 320,84" fill="black" />
  
  <!-- int8 calculation to Dequantization/Quantization -->
  <line x1="430" y1="75" x2="480" y2="75" stroke="black" stroke-width="2" />
  <polygon points="478,71 488,75 478,79" fill="black" />
  
  <!-- Dequantization/Quantization to int8 output -->
  <line x1="620" y1="75" x2="670" y2="75" stroke="black" stroke-width="2" />
  <polygon points="668,71 678,75 668,79" fill="black" />
</svg>
