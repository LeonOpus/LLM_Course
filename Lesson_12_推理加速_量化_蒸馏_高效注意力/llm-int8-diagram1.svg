<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="800" height="400" fill="white"/>
  
  <!-- Title removed -->
  
  <!-- Input1 matrix -->
  <rect x="80" y="80" width="30" height="30" fill="#6495ED"/>
  <rect x="110" y="80" width="30" height="30" fill="#6495ED"/>
  <rect x="140" y="80" width="30" height="30" fill="#6495ED"/>
  <rect x="80" y="110" width="30" height="30" fill="#6495ED"/>
  <rect x="110" y="110" width="30" height="30" fill="#6495ED"/>
  <rect x="140" y="110" width="30" height="30" fill="#6495ED"/>
  <rect x="80" y="140" width="30" height="30" fill="#6495ED"/>
  <rect x="110" y="140" width="30" height="30" fill="#6495ED"/>
  <rect x="140" y="140" width="30" height="30" fill="#6495ED"/>
  
  <!-- Input1 matrix values removed -->
  
  <text x="125" y="185" font-family="Arial" font-size="14" text-anchor="middle" fill="black">input1</text>
  
  <!-- Multiplication symbol 1 -->
  <text x="190" y="130" font-family="Arial" font-size="24" text-anchor="middle" fill="black">×</text>
  
  <!-- Weight1 matrix -->
  <rect x="230" y="80" width="30" height="30" fill="#6495ED"/>
  <rect x="260" y="80" width="30" height="30" fill="#6495ED"/>
  <rect x="290" y="80" width="30" height="30" fill="#6495ED"/>
  <rect x="230" y="110" width="30" height="30" fill="#6495ED"/>
  <rect x="260" y="110" width="30" height="30" fill="#6495ED"/>
  <rect x="290" y="110" width="30" height="30" fill="#6495ED"/>
  <rect x="230" y="140" width="30" height="30" fill="#6495ED"/>
  <rect x="260" y="140" width="30" height="30" fill="#6495ED"/>
  <rect x="290" y="140" width="30" height="30" fill="#6495ED"/>
  
  <!-- Weight1 matrix values removed -->
  
  <text x="260" y="185" font-family="Arial" font-size="14" text-anchor="middle" fill="black">weight1</text>
  
  <!-- Right arrow 1 -->
  <line x1="330" y1="130" x2="370" y2="130" stroke="black" stroke-width="2"/>
  <polygon points="370,130 360,125 360,135" fill="black"/>
  
  <!-- int8 quantization box -->
  <rect x="380" y="110" width="80" height="40" fill="#4169E1" rx="5" ry="5"/>
  <text x="420" y="135" font-family="Arial" font-size="14" text-anchor="middle" fill="white">int8量化</text>
  
  <!-- Right arrow 2 -->
  <line x1="470" y1="130" x2="510" y2="130" stroke="black" stroke-width="2"/>
  <polygon points="510,130 500,125 500,135" fill="black"/>
  
  <!-- int8 calculation box -->
  <rect x="520" y="110" width="80" height="40" fill="#4169E1" rx="5" ry="5"/>
  <text x="560" y="135" font-family="Arial" font-size="14" text-anchor="middle" fill="white">int8计算</text>
  
  <!-- Dequantization arrow down -->
  <line x1="560" y1="150" x2="560" y2="170" stroke="black" stroke-width="2"/>
  <polygon points="560,170 555,160 565,160" fill="black"/>
  
  <!-- Dequantization box -->
  <rect x="520" y="175" width="80" height="40" fill="#4169E1" rx="5" ry="5"/>
  <text x="560" y="200" font-family="Arial" font-size="14" text-anchor="middle" fill="white">反量化</text>
  
  <!-- FP16 conversion arrow right -->
  <line x1="560" y1="215" x2="560" y2="235" stroke="black" stroke-width="2"/>
  <polygon points="560,235 555,225 565,225" fill="black"/>
  
  <!-- FP16 conversion box -->
  <rect x="520" y="240" width="80" height="40" fill="#4169E1" rx="5" ry="5"/>
  <text x="560" y="265" font-family="Arial" font-size="14" text-anchor="middle" fill="white">fp16转换</text>
  
  <!-- Plus sign -->
  <text x="560" y="300" font-family="Arial" font-size="30" text-anchor="middle" fill="black">+</text>
  
  <!-- Input2 matrix -->
  <rect x="85" y="220" width="30" height="30" fill="#FFA500"/>
  <rect x="115" y="220" width="30" height="30" fill="#FFA500"/>
  <rect x="85" y="250" width="30" height="30" fill="#FFA500"/>
  <rect x="115" y="250" width="30" height="30" fill="#FFA500"/>
  <rect x="85" y="280" width="30" height="30" fill="#FFA500"/>
  <rect x="115" y="280" width="30" height="30" fill="#FFA500"/>
  
  <!-- Input2 matrix values removed -->
  
  <text x="115" y="325" font-family="Arial" font-size="14" text-anchor="middle" fill="black">input2</text>
  
  <!-- Multiplication symbol 2 -->
  <text x="190" y="270" font-family="Arial" font-size="24" text-anchor="middle" fill="black">×</text>
  
  <!-- Weight2 matrix -->
  <rect x="235" y="235" width="30" height="30" fill="#FFA500"/>
  <rect x="265" y="235" width="30" height="30" fill="#FFA500"/>
  <rect x="295" y="235" width="30" height="30" fill="#FFA500"/>
  <rect x="235" y="265" width="30" height="30" fill="#FFA500"/>
  <rect x="265" y="265" width="30" height="30" fill="#FFA500"/>
  <rect x="295" y="265" width="30" height="30" fill="#FFA500"/>
  
  <!-- Weight2 matrix values removed -->
  
  <text x="265" y="325" font-family="Arial" font-size="14" text-anchor="middle" fill="black">weight2</text>
  
  <!-- Right arrow 3 -->
  <line x1="330" y1="270" x2="370" y2="270" stroke="black" stroke-width="2"/>
  <polygon points="370,270 360,265 360,275" fill="black"/>
  
  <!-- FP16 calculation box -->
  <rect x="380" y="250" width="80" height="40" fill="#FFA500" rx="5" ry="5"/>
  <text x="420" y="275" font-family="Arial" font-size="14" text-anchor="middle" fill="white">fp16计算结果</text>
  
  <!-- Final result arrow right -->
  <line x1="470" y1="270" x2="510" y2="270" stroke="black" stroke-width="2"/>
  <polygon points="510,270 500,265 500,275" fill="black"/>
  
  <!-- Final result box -->
  <rect x="520" y="340" width="80" height="40" fill="#4169E1" rx="5" ry="5"/>
  <text x="560" y="365" font-family="Arial" font-size="14" text-anchor="middle" fill="white">最终结果</text>
</svg>