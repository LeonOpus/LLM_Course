<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#16213e" />
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4361ee" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Circuit pattern -->
    <pattern id="circuitPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M10,10 L90,10 M50,10 L50,90 M10,50 L90,50 M10,90 L90,90" stroke="#3a506b" stroke-width="0.5" fill="none" />
      <circle cx="10" cy="10" r="2" fill="#3a506b" />
      <circle cx="50" cy="10" r="2" fill="#3a506b" />
      <circle cx="90" cy="10" r="2" fill="#3a506b" />
      <circle cx="10" cy="50" r="2" fill="#3a506b" />
      <circle cx="50" cy="50" r="2" fill="#3a506b" />
      <circle cx="90" cy="50" r="2" fill="#3a506b" />
      <circle cx="10" cy="90" r="2" fill="#3a506b" />
      <circle cx="50" cy="90" r="2" fill="#3a506b" />
      <circle cx="90" cy="90" r="2" fill="#3a506b" />
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)" />
  <rect width="800" height="600" fill="url(#circuitPattern)" opacity="0.15" />
  
  <!-- Decorative elements -->
  <circle cx="700" cy="100" r="60" fill="url(#accentGradient)" opacity="0.2" />
  <circle cx="100" cy="500" r="80" fill="url(#accentGradient)" opacity="0.1" />
  
  <!-- Abstract data flow shapes -->
  <path d="M150,400 C250,350 350,450 450,350 S650,400 750,300" stroke="url(#accentGradient)" stroke-width="3" fill="none" opacity="0.7" />
  <path d="M50,350 C150,300 250,400 350,300 S550,350 650,250" stroke="url(#accentGradient)" stroke-width="3" fill="none" opacity="0.5" />
  
  <!-- Title container -->
  <rect x="100" y="80" width="600" height="100" rx="10" fill="#1e2a3a" opacity="0.9" />
  
  <!-- Title - Main -->
  <text x="400" y="120" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#ffffff">基于Qwen蒸馏GPT4.1</text>
  <text x="400" y="160" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#a6b1e1">大型语言模型进阶训练课程</text>
  
  <!-- Decorative line -->
  <line x1="200" y1="200" x2="600" y2="200" stroke="url(#accentGradient)" stroke-width="3" />
  
  <!-- Process steps -->
  <!-- Step 1 -->
  <g>
    <circle cx="200" cy="280" r="40" fill="#1e2a3a" stroke="url(#accentGradient)" stroke-width="2" />
    <text x="200" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
    <text x="200" y="340" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#ffffff">数据获取</text>
    <path d="M240,280 L260,280" stroke="#3a506b" stroke-width="2" stroke-dasharray="2" />
  </g>
  
  <!-- Step 2 -->
  <g>
    <circle cx="300" cy="280" r="40" fill="#1e2a3a" stroke="url(#accentGradient)" stroke-width="2" />
    <text x="300" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
    <text x="300" y="340" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#ffffff">数据去重过滤</text>
    <path d="M340,280 L360,280" stroke="#3a506b" stroke-width="2" stroke-dasharray="2" />
  </g>
  
  <!-- Step 3 -->
  <g>
    <circle cx="400" cy="280" r="40" fill="#1e2a3a" stroke="url(#accentGradient)" stroke-width="2" />
    <text x="400" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
    <text x="400" y="340" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#ffffff">数据合成</text>
    <path d="M440,280 L460,280" stroke="#3a506b" stroke-width="2" stroke-dasharray="2" />
  </g>
  
  <!-- Step 4 -->
  <g>
    <circle cx="500" cy="280" r="40" fill="#1e2a3a" stroke="url(#accentGradient)" stroke-width="2" />
    <text x="500" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
    <text x="500" y="340" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#ffffff">分布式训练</text>
  </g>
  
  <!-- Bottom Info Box -->
  <rect x="150" y="400" width="500" height="120" rx="10" fill="#1e2a3a" opacity="0.8" />
  
  <!-- Content inside box -->
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">掌握大模型训练核心技术</text>
  <text x="400" y="470" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#a6b1e1">从数据处理到高效训练的全流程实战指南</text>
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#a6b1e1">适合AI工程师和研究人员的进阶课程</text>
  
  <!-- Animated pulse effect -->
  <circle cx="400" cy="280" r="150" fill="url(#accentGradient)" opacity="0.05">
    <animate attributeName="r" values="150;160;150" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.05;0.1;0.05" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>