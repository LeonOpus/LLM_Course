    <line x1="405" y1="140" x2="615" y2="140"/>
    <line x1="405" y1="155" x2="615" y2="155"/>
    <line x1="405" y1="170" x2="615" y2="170"/>
    <line x1="405" y1="185" x2="615" y2="185"/>
    <line x1="405" y1="200" x2="615" y2="200"/>
    <line x1="405" y1="215" x2="615" y2="215"/>
    <line x1="405" y1="230" x2="615" y2="230"/>
    <line x1="405" y1="245" x2="615" y2="245"/>
    <line x1="405" y1="260" x2="615" y2="260"/>
    <line x1="405" y1="275" x2="615" y2="275"/>
    <line x1="405" y1="290" x2="615" y2="290"/>
    <line x1="405" y1="305" x2="615" y2="305"/>
  </g>

