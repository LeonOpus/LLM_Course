<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="800" height="350" fill="white"/>
  
  <!-- Attention Formula Box -->
  <rect x="220" y="20" width="360" height="60" fill="white" stroke="black" stroke-width="1"/>
  <text x="400" y="55" font-family="serif" font-size="18" text-anchor="middle">Attention(Q, K, V) = softmax(</text>
  <text x="520" y="55" font-family="serif" font-size="18" text-anchor="middle">QK&#x1D40;</text>
  <text x="550" y="55" font-family="serif" font-size="18" text-anchor="middle">)V</text>
  <line x1="520" y1="62" x2="520" y2="62" stroke="black" stroke-width="1"/>
  <text x="520" y="75" font-family="serif" font-size="14" text-anchor="middle">√d&#x1D4F8;&#x1D49;&#x1D463;</text>

  <!-- Q Matrix -->
  <rect x="35" y="50" width="60" height="60" fill="#FFEB3B" stroke="black" stroke-width="1"/>
  <text x="65" y="85" font-family="Arial" font-size="30" font-weight="bold" text-anchor="middle">Q</text>
  
  <!-- Q Matrix details -->
  <rect x="35" y="110" width="60" height="210" fill="#CCCCCC" stroke="black" stroke-width="1"/>
  <!-- Purple cells at top of Q -->
  <rect x="35" y="110" width="15" height="15" fill="#6A0DAD" stroke="black" stroke-width="1"/>
  <rect x="50" y="110" width="15" height="15" fill="#6A0DAD" stroke="black" stroke-width="1"/>
  <rect x="65" y="110" width="15" height="15" fill="#6A0DAD" stroke="black" stroke-width="1"/>
  <rect x="80" y="110" width="15" height="15" fill="#6A0DAD" stroke="black" stroke-width="1"/>
  
  <rect x="35" y="125" width="15" height="15" fill="#6A0DAD" stroke="black" stroke-width="1"/>
  <rect x="50" y="125" width="15" height="15" fill="#6A0DAD" stroke="black" stroke-width="1"/>
  <rect x="65" y="125" width="15" height="15" fill="#6A0DAD" stroke="black" stroke-width="1"/>
  <rect x="80" y="125" width="15" height="15" fill="#6A0DAD" stroke="black" stroke-width="1"/>
  
  <!-- Gray grid cells -->
