    <line x1="665" y1="230" x2="725" y2="230"/>
    <line x1="665" y1="245" x2="725" y2="245"/>
    <line x1="665" y1="260" x2="725" y2="260"/>
    <line x1="665" y1="275" x2="725" y2="275"/>
    <line x1="665" y1="290" x2="725" y2="290"/>
