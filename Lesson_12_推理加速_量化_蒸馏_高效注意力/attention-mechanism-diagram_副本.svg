  <!-- Teal cells at top of V -->
  <rect x="665" y="110" width="15" height="15" fill="#20B2AA" stroke="black" stroke-width="1"/>
  <rect x="680" y="110" width="15" height="15" fill="#20B2AA" stroke="black" stroke-width="1"/>
  <rect x="695" y="110" width="15" height="15" fill="#20B2AA" stroke="black" stroke-width="1"/>
  <rect x="710" y="110" width="15" height="15" fill="#20B2AA" stroke="black" stroke-width="1"/>
  
  <rect x="665" y="125" width="15" height="15" fill="#20B2AA" stroke="black" stroke-width="1"/>
  <rect x="680" y="125" width="15" height="15" fill="#20B2AA" stroke="black" stroke-width="1"/>
  <rect x="695" y="125" width="15" height="15" fill="#20B2AA" stroke="black" stroke-width="1"/>
  <rect x="710" y="125" width="15" height="15" fill="#20B2AA" stroke="black" stroke-width="1"/>
  
