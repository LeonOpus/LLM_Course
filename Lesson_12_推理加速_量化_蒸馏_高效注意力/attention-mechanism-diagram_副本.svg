  <rect x="50" y="140" width="15" height="15" fill="#888888" stroke="black" stroke-width="1"/>
  <rect x="65" y="140" width="15" height="15" fill="#888888" stroke="black" stroke-width="1"/>
  <rect x="80" y="140" width="15" height="15" fill="#888888" stroke="black" stroke-width="1"/>
  
  <!-- More gray rows -->
  <rect x="35" y="155" width="60" height="165" fill="#CCCCCC" stroke="black" stroke-width="1"/>
  <!-- Grid pattern for the rest of Q -->
