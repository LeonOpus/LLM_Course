<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景和网格 -->
  <rect width="800" height="350" fill="#f8f9fa" rx="8" ry="8"/>
  
  <!-- 注意力块 1 -->
  <rect x="100" y="50" width="250" height="250" fill="#e6f2ff" stroke="#3498db" stroke-width="2" rx="10" ry="10"/>
  <text x="225" y="30" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">注意力块 1</text>
  
  <!-- 多头注意力机制 在块 1 中 -->
  <rect x="125" y="80" width="200" height="80" fill="#bbd9f5" stroke="#3498db" stroke-width="1.5" rx="5" ry="5"/>
  <text x="225" y="110" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">多头注意力机制</text>
  <text x="225" y="130" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">Q, K, V 变换</text>
  
  <!-- 加法与归一化 在块 1 中 -->
  <rect x="125" y="170" width="200" height="40" fill="#d4e9fa" stroke="#3498db" stroke-width="1.5" rx="5" ry="5"/>
  <text x="225" y="195" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">加法与归一化</text>
  
  <!-- 前馈网络 在块 1 中 -->
  <rect x="125" y="220" width="200" height="50" fill="#bbd9f5" stroke="#3498db" stroke-width="1.5" rx="5" ry="5"/>
  <text x="225" y="250" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">前馈神经网络</text>
  
  <!-- 注意力块 2 -->
  <rect x="450" y="50" width="250" height="250" fill="#f2e6ff" stroke="#9b59b6" stroke-width="2" rx="10" ry="10"/>
  <text x="575" y="30" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">注意力块 2</text>
  
  <!-- 多头注意力机制 在块 2 中 -->
  <rect x="475" y="80" width="200" height="80" fill="#d8c4e8" stroke="#9b59b6" stroke-width="1.5" rx="5" ry="5"/>
  <text x="575" y="110" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">多头注意力机制</text>
  <text x="575" y="130" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">Q, K, V 变换</text>
  
  <!-- 加法与归一化 在块 2 中 -->
  <rect x="475" y="170" width="200" height="40" fill="#e6d4f1" stroke="#9b59b6" stroke-width="1.5" rx="5" ry="5"/>
  <text x="575" y="195" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">加法与归一化</text>
  
  <!-- 前馈网络 在块 2 中 -->
  <rect x="475" y="220" width="200" height="50" fill="#d8c4e8" stroke="#9b59b6" stroke-width="1.5" rx="5" ry="5"/>
  <text x="575" y="250" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">前馈神经网络</text>
  
  <!-- 连接箭头 -->
  <!-- 输入箭头 -->
  <line x1="40" y1="175" x2="100" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="70" y="160" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">输入</text>
  
  <!-- 中间连接 -->
  <line x1="350" y1="175" x2="450" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 输出箭头 -->
  <line x1="700" y1="175" x2="760" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="730" y="160" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">输出</text>
  
  <!-- 残差连接 在块 1 中 -->
  <path d="M 100,100 L 80,100 L 80,190 L 100,190" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="5,3"/>
  <path d="M 100,205 L 60,205 L 60,245 L 100,245" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="5,3"/>
  
  <!-- 残差连接 在块 2 中 -->
  <path d="M 450,100 L 430,100 L 430,190 L 450,190" fill="none" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <path d="M 450,205 L 410,205 L 410,245 L 450,245" fill="none" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="5,3"/>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>
