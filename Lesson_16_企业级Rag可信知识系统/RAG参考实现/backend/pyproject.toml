[project]
name = "rag-course-backend"
version = "0.1.0"
description = "设备知识库RAG实训后端"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<0.29",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.18,<1",
  "pymilvus>=3.0,<3.1",
  "alibabacloud-docmind-api20220711>=1.0,<5",
  "alibabacloud-tea-openapi>=0.3,<1",
  "alibabacloud-tea-util>=0.3,<1",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "python-pptx==1.0.2",
  "pypdf>=6,<7",
  "pypdfium2>=5,<6",
  "pillow==12.3.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
