<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">

  <rect width="1200" height="900" fill="#fafafa"/>

  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="300" fill="#1f2937" letter-spacing="0.5">Multi-Agent Memory System Architecture</text>
  <text x="600" y="68" text-anchor="middle" font-size="12" fill="#9ca3af" letter-spacing="2">WEEK 4 PROJECT</text>

  <!-- User -->
  <g transform="translate(540, 95)">
    <rect x="0" y="0" width="120" height="40" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="25" cy="20" r="10" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="25" cy="17" r="4" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <path d="M17 28 Q25 24 33 28" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" font-size="11" fill="#4b5563">User</text>
  </g>

  <!-- Arrow: User to API -->
  <line x1="600" y1="140" x2="600" y2="170" stroke="#d1d5db" stroke-width="1.5"/>
  <polygon points="600,175 595,165 605,165" fill="#9ca3af"/>

  <!-- API Layer -->
  <g transform="translate(100, 175)">
    <rect x="0" y="0" width="1000" height="70" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="20" y="-12" width="80" height="24" rx="4" fill="#f3f4f6"/>
    <text x="60" y="3" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="500">API LAYER</text>
    <text x="500" y="30" text-anchor="middle" font-size="14" fill="#374151" font-weight="500">FastAPI Service</text>
    <g transform="translate(150, 45)">
      <rect x="0" y="0" width="100" height="20" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
      <text x="50" y="14" text-anchor="middle" font-size="9" fill="#6b7280">/api/research</text>
    </g>
    <g transform="translate(270, 45)">
      <rect x="0" y="0" width="100" height="20" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
      <text x="50" y="14" text-anchor="middle" font-size="9" fill="#6b7280">/api/analyze</text>
    </g>
    <g transform="translate(390, 45)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
      <text x="60" y="14" text-anchor="middle" font-size="9" fill="#6b7280">/api/complex-task</text>
    </g>
    <g transform="translate(530, 45)">
      <rect x="0" y="0" width="100" height="20" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
      <text x="50" y="14" text-anchor="middle" font-size="9" fill="#6b7280">/api/memory/*</text>
    </g>
    <g transform="translate(650, 45)">
      <rect x="0" y="0" width="100" height="20" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
      <text x="50" y="14" text-anchor="middle" font-size="9" fill="#6b7280">/api/chat</text>
    </g>
    <g transform="translate(820, 20)">
      <rect x="0" y="0" width="140" height="40" rx="4" fill="#fafafa" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="3,2"/>
      <text x="70" y="17" text-anchor="middle" font-size="9" fill="#9ca3af">Observability</text>
      <text x="70" y="30" text-anchor="middle" font-size="9" fill="#6b7280">Middleware</text>
    </g>
  </g>

  <!-- Arrow: API to Agent -->
  <line x1="600" y1="250" x2="600" y2="285" stroke="#d1d5db" stroke-width="1.5"/>
  <polygon points="600,290 595,280 605,280" fill="#9ca3af"/>

  <!-- Agent Layer -->
  <g transform="translate(100, 290)">
    <rect x="0" y="0" width="1000" height="200" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="20" y="-12" width="100" height="24" rx="4" fill="#f3f4f6"/>
    <text x="70" y="3" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="500">AGENT LAYER</text>

    <!-- CEO Agent -->
    <g transform="translate(400, 25)">
      <rect x="0" y="0" width="200" height="60" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
      <rect x="0" y="0" width="200" height="4" rx="2" fill="#374151"/>
      <text x="100" y="28" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="500">CEO Agent</text>
      <text x="100" y="44" text-anchor="middle" font-size="9" fill="#9ca3af">SOP Orchestration · DAG Execution</text>
    </g>

    <!-- Researcher -->
    <g transform="translate(60, 110)">
      <rect x="0" y="0" width="180" height="70" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <rect x="0" y="0" width="180" height="3" rx="1.5" fill="#6b7280"/>
      <text x="90" y="28" text-anchor="middle" font-size="12" fill="#374151" font-weight="500">Researcher</text>
      <text x="90" y="44" text-anchor="middle" font-size="9" fill="#9ca3af">Iterative Search</text>
      <text x="90" y="58" text-anchor="middle" font-size="9" fill="#9ca3af">Source Citation</text>
    </g>

    <!-- Analyst -->
    <g transform="translate(280, 110)">
      <rect x="0" y="0" width="180" height="70" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <rect x="0" y="0" width="180" height="3" rx="1.5" fill="#6b7280"/>
      <text x="90" y="28" text-anchor="middle" font-size="12" fill="#374151" font-weight="500">Analyst</text>
      <text x="90" y="44" text-anchor="middle" font-size="9" fill="#9ca3af">Code Generation</text>
      <text x="90" y="58" text-anchor="middle" font-size="9" fill="#9ca3af">Auto-Fix Retry</text>
    </g>

    <!-- Critic -->
    <g transform="translate(500, 110)">
      <rect x="0" y="0" width="180" height="70" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <rect x="0" y="0" width="180" height="3" rx="1.5" fill="#6b7280"/>
      <text x="90" y="28" text-anchor="middle" font-size="12" fill="#374151" font-weight="500">Critic</text>
      <text x="90" y="44" text-anchor="middle" font-size="9" fill="#9ca3af">Quality Review</text>
      <text x="90" y="58" text-anchor="middle" font-size="9" fill="#9ca3af">Fact Checking</text>
    </g>

    <!-- Review Loop -->
    <g transform="translate(720, 110)">
      <rect x="0" y="0" width="220" height="70" rx="6" fill="#fafafa" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,2"/>
      <text x="110" y="25" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="500">Review Loop</text>
      <g transform="translate(40, 35)">
        <rect x="0" y="0" width="50" height="24" rx="3" fill="#f3f4f6" stroke="#d1d5db" stroke-width="0.5"/>
        <text x="25" y="16" text-anchor="middle" font-size="8" fill="#6b7280">Execute</text>
      </g>
      <line x1="95" y1="47" x2="115" y2="47" stroke="#d1d5db" stroke-width="1"/>
      <polygon points="120,47 112,44 112,50" fill="#d1d5db"/>
      <g transform="translate(120, 35)">
        <rect x="0" y="0" width="50" height="24" rx="3" fill="#f3f4f6" stroke="#d1d5db" stroke-width="0.5"/>
        <text x="25" y="16" text-anchor="middle" font-size="8" fill="#6b7280">Review</text>
      </g>
      <path d="M145 62 Q145 75 105 75 Q65 75 65 62" stroke="#d1d5db" stroke-width="1" fill="none"/>
      <polygon points="65,62 62,70 68,70" fill="#d1d5db"/>
      <text x="105" y="82" text-anchor="middle" font-size="7" fill="#9ca3af">revise</text>
    </g>

    <!-- CEO to agents lines -->
    <line x1="450" y1="85" x2="150" y2="110" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="500" y1="85" x2="370" y2="110" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="550" y1="85" x2="590" y2="110" stroke="#e5e7eb" stroke-width="1"/>
    <text x="260" y="100" font-size="8" fill="#9ca3af">asyncio.gather</text>
  </g>

  <!-- Arrow: Agent to Tools -->
  <line x1="600" y1="495" x2="600" y2="530" stroke="#d1d5db" stroke-width="1.5"/>
  <polygon points="600,535 595,525 605,525" fill="#9ca3af"/>

  <!-- Tools Layer -->
  <g transform="translate(100, 535)">
    <rect x="0" y="0" width="650" height="100" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="20" y="-12" width="90" height="24" rx="4" fill="#f3f4f6"/>
    <text x="65" y="3" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="500">TOOLS LAYER</text>

    <!-- Web Search -->
    <g transform="translate(40, 25)">
      <rect x="0" y="0" width="170" height="55" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <circle cx="25" cy="27" r="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <line x1="22" y1="24" x2="28" y2="24" stroke="#9ca3af" stroke-width="1"/>
      <line x1="22" y1="27" x2="28" y2="27" stroke="#9ca3af" stroke-width="1"/>
      <line x1="22" y1="30" x2="28" y2="30" stroke="#9ca3af" stroke-width="1"/>
      <text x="100" y="23" text-anchor="middle" font-size="11" fill="#374151" font-weight="500">Web Search</text>
      <text x="100" y="38" text-anchor="middle" font-size="9" fill="#9ca3af">Bocha API</text>
    </g>

    <!-- Embedding -->
    <g transform="translate(240, 25)">
      <rect x="0" y="0" width="170" height="55" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <rect x="15" y="18" width="18" height="18" rx="2" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <line x1="18" y1="23" x2="30" y2="23" stroke="#9ca3af" stroke-width="1"/>
      <line x1="18" y1="27" x2="30" y2="27" stroke="#9ca3af" stroke-width="1"/>
      <line x1="18" y1="31" x2="27" y2="31" stroke="#9ca3af" stroke-width="1"/>
      <text x="105" y="23" text-anchor="middle" font-size="11" fill="#374151" font-weight="500">Embedding</text>
      <text x="105" y="38" text-anchor="middle" font-size="9" fill="#9ca3af">text-embedding-v4</text>
    </g>

    <!-- LLM -->
    <g transform="translate(440, 25)">
      <rect x="0" y="0" width="170" height="55" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <rect x="15" y="18" width="18" height="18" rx="9" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="24" y="31" text-anchor="middle" font-size="8" fill="#9ca3af">AI</text>
      <text x="105" y="23" text-anchor="middle" font-size="11" fill="#374151" font-weight="500">LLM Service</text>
      <text x="105" y="38" text-anchor="middle" font-size="9" fill="#9ca3af">DeepSeek-v3.2</text>
    </g>
  </g>

  <!-- Memory Layer -->
  <g transform="translate(780, 535)">
    <rect x="0" y="0" width="320" height="100" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="20" y="-12" width="110" height="24" rx="4" fill="#f3f4f6"/>
    <text x="75" y="3" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="500">MEMORY LAYER</text>

    <g transform="translate(20, 25)">
      <rect x="0" y="0" width="85" height="55" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="42" y="23" text-anchor="middle" font-size="10" fill="#374151" font-weight="500">Short-term</text>
      <text x="42" y="38" text-anchor="middle" font-size="8" fill="#9ca3af">Buffer</text>
      <text x="42" y="48" text-anchor="middle" font-size="7" fill="#d1d5db">sliding window</text>
    </g>

    <g transform="translate(118, 25)">
      <rect x="0" y="0" width="85" height="55" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="42" y="23" text-anchor="middle" font-size="10" fill="#374151" font-weight="500">Long-term</text>
      <text x="42" y="38" text-anchor="middle" font-size="8" fill="#9ca3af">Milvus</text>
      <text x="42" y="48" text-anchor="middle" font-size="7" fill="#d1d5db">vector store</text>
    </g>

    <g transform="translate(216, 25)">
      <rect x="0" y="0" width="85" height="55" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="42" y="23" text-anchor="middle" font-size="10" fill="#374151" font-weight="500">Dreaming</text>
      <text x="42" y="38" text-anchor="middle" font-size="8" fill="#9ca3af">Consolidation</text>
      <text x="42" y="48" text-anchor="middle" font-size="7" fill="#d1d5db">clustering</text>
    </g>

    <line x1="108" y1="52" x2="115" y2="52" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="206" y1="52" x2="213" y2="52" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <!-- Connection: Tools to Memory -->
  <line x1="750" y1="585" x2="780" y2="585" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Observability Layer -->
  <g transform="translate(100, 670)">
    <rect x="0" y="0" width="1000" height="80" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6,3"/>
    <rect x="20" y="-12" width="120" height="24" rx="4" fill="#f3f4f6"/>
    <text x="80" y="3" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="500">OBSERVABILITY</text>
    <text x="500" y="30" text-anchor="middle" font-size="14" fill="#374151" font-weight="400">LangFuse Tracing</text>

    <g transform="translate(150, 45)">
      <rect x="0" y="0" width="140" height="24" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.5"/>
      <circle cx="15" cy="12" r="4" fill="#d1d5db"/>
      <text x="80" y="16" text-anchor="middle" font-size="9" fill="#6b7280">Token Usage</text>
    </g>
    <g transform="translate(320, 45)">
      <rect x="0" y="0" width="140" height="24" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.5"/>
      <circle cx="15" cy="12" r="4" fill="#d1d5db"/>
      <text x="80" y="16" text-anchor="middle" font-size="9" fill="#6b7280">Latency (ms)</text>
    </g>
    <g transform="translate(490, 45)">
      <rect x="0" y="0" width="140" height="24" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.5"/>
      <circle cx="15" cy="12" r="4" fill="#d1d5db"/>
      <text x="80" y="16" text-anchor="middle" font-size="9" fill="#6b7280">Trace Context</text>
    </g>
    <g transform="translate(660, 45)">
      <rect x="0" y="0" width="140" height="24" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.5"/>
      <circle cx="15" cy="12" r="4" fill="#d1d5db"/>
      <text x="80" y="16" text-anchor="middle" font-size="9" fill="#6b7280">Generation Logs</text>
    </g>
    <g transform="translate(830, 45)">
      <rect x="0" y="0" width="140" height="24" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.5"/>
      <circle cx="15" cy="12" r="4" fill="#d1d5db"/>
      <text x="80" y="16" text-anchor="middle" font-size="9" fill="#6b7280">Cost Analysis</text>
    </g>
  </g>

  <!-- Tracing lines -->
  <line x1="425" y1="635" x2="425" y2="665" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="940" y1="635" x2="940" y2="665" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Legend -->
  <g transform="translate(100, 790)">
    <rect x="0" y="0" width="1000" height="60" rx="6" fill="#ffffff" stroke="#f3f4f6" stroke-width="1"/>
    <text x="50" y="20" font-size="10" fill="#9ca3af" font-weight="500">LEGEND</text>

    <g transform="translate(130, 25)">
      <line x1="0" y1="12" x2="40" y2="12" stroke="#9ca3af" stroke-width="1.5"/>
      <polygon points="45,12 38,9 38,15" fill="#9ca3af"/>
      <text x="60" y="16" font-size="9" fill="#6b7280">Request Flow</text>
    </g>
    <g transform="translate(280, 25)">
      <line x1="0" y1="12" x2="40" y2="12" stroke="#e5e7eb" stroke-width="1"/>
      <text x="55" y="16" font-size="9" fill="#6b7280">Data Flow</text>
    </g>
    <g transform="translate(420, 25)">
      <line x1="0" y1="12" x2="40" y2="12" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="55" y="16" font-size="9" fill="#6b7280">Tracing</text>
    </g>

    <g transform="translate(560, 10)">
      <text x="0" y="12" font-size="9" fill="#9ca3af">Tech Stack:</text>
      <rect x="70" y="0" width="80" height="18" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
      <text x="110" y="12" text-anchor="middle" font-size="8" fill="#6b7280">FastAPI</text>
      <rect x="160" y="0" width="100" height="18" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
      <text x="210" y="12" text-anchor="middle" font-size="8" fill="#6b7280">DeepSeek-v3.2</text>
      <rect x="270" y="0" width="60" height="18" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
      <text x="300" y="12" text-anchor="middle" font-size="8" fill="#6b7280">Milvus</text>
      <rect x="340" y="0" width="70" height="18" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
      <text x="375" y="12" text-anchor="middle" font-size="8" fill="#6b7280">LangFuse</text>
    </g>
    <g transform="translate(560, 32)">
      <rect x="70" y="0" width="80" height="18" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
      <text x="110" y="12" text-anchor="middle" font-size="8" fill="#6b7280">Bocha API</text>
      <rect x="160" y="0" width="100" height="18" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
      <text x="210" y="12" text-anchor="middle" font-size="8" fill="#6b7280">Embedding-v4</text>
      <rect x="270" y="0" width="60" height="18" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
      <text x="300" y="12" text-anchor="middle" font-size="8" fill="#6b7280">Redis</text>
    </g>
  </g>

  <text x="1150" y="880" text-anchor="end" font-size="9" fill="#d1d5db">v1.0.0</text>
</svg>
