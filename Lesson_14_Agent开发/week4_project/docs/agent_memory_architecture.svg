<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3182ce"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38a169"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="600" fill="#1a1a1a">Multi-Agent System with Memory Integration</text>

  <!-- User Request -->
  <rect x="350" y="55" width="200" height="40" rx="4" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
  <text x="450" y="80" text-anchor="middle" font-family="system-ui" font-size="13" fill="#4a5568">User Task Request</text>

  <!-- Arrow from User to CEO -->
  <line x1="450" y1="95" x2="450" y2="125" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- CEO Agent Box -->
  <rect x="100" y="130" width="700" height="320" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="100" y="130" width="700" height="35" rx="8" fill="#1a1a1a"/>
  <rect x="100" y="157" width="700" height="8" fill="#1a1a1a"/>
  <text x="450" y="153" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="600" fill="#fff">CEO Agent (ceo.py)</text>

  <!-- Memory Read Section -->
  <rect x="120" y="175" width="250" height="80" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="245" y="195" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#2c5282">[Memory Read] L155-162</text>
  <text x="245" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a5568">memory.retrieve_context(task)</text>
  <text x="245" y="232" text-anchor="middle" font-family="system-ui" font-size="10" fill="#718096">→ context["memory_context"]</text>
  <text x="245" y="247" text-anchor="middle" font-family="system-ui" font-size="10" fill="#718096">→ context["user_profile"]</text>

  <!-- DAG Execution Section -->
  <rect x="390" y="175" width="390" height="180" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1"/>
  <text x="585" y="195" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#4a5568">_execute_sop() - DAG Task Flow</text>

  <!-- Researcher -->
  <rect x="410" y="210" width="100" height="55" rx="4" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/>
  <text x="460" y="232" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#2c5282">Researcher</text>
  <text x="460" y="248" text-anchor="middle" font-family="system-ui" font-size="9" fill="#4a5568">Web Search</text>
  <text x="460" y="260" text-anchor="middle" font-family="system-ui" font-size="9" fill="#4a5568">Report Gen</text>

  <!-- Analyst -->
  <rect x="530" y="210" width="100" height="55" rx="4" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/>
  <text x="580" y="232" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#276749">Analyst</text>
  <text x="580" y="248" text-anchor="middle" font-family="system-ui" font-size="9" fill="#4a5568">Code Gen</text>
  <text x="580" y="260" text-anchor="middle" font-family="system-ui" font-size="9" fill="#4a5568">Visualization</text>

  <!-- Critic -->
  <rect x="650" y="210" width="100" height="55" rx="4" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
  <text x="700" y="232" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#744210">Critic</text>
  <text x="700" y="248" text-anchor="middle" font-family="system-ui" font-size="9" fill="#4a5568">Fact Check</text>
  <text x="700" y="260" text-anchor="middle" font-family="system-ui" font-size="9" fill="#4a5568">Quality Score</text>

  <!-- DAG Arrows -->
  <line x1="510" y1="237" x2="528" y2="237" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="630" y1="237" x2="648" y2="237" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Review Loop -->
  <rect x="410" y="280" width="340" height="60" rx="4" fill="#fff5f5" stroke="#c53030" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="580" y="300" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="600" fill="#c53030">Review Loop</text>
  <text x="580" y="315" text-anchor="middle" font-family="system-ui" font-size="9" fill="#718096">Execute → Critic Review → Feedback Injection → Retry</text>
  <text x="580" y="330" text-anchor="middle" font-family="monospace" font-size="9" fill="#718096">context["review_feedback"] = {issues, suggestions}</text>

  <!-- Arrow from Memory Read to DAG -->
  <line x1="370" y1="215" x2="388" y2="215" stroke="#3182ce" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>

  <!-- Memory Write Section -->
  <rect x="120" y="360" width="250" height="80" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="245" y="380" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#276749">[Memory Write] L177-188</text>
  <text x="245" y="400" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a5568">memory.add_turn("user", task)</text>
  <text x="245" y="417" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a5568">memory.add_turn("assistant", result)</text>
  <text x="245" y="434" text-anchor="middle" font-family="system-ui" font-size="10" fill="#718096">→ Auto archive when buffer > 8</text>

  <!-- Arrow from DAG to Memory Write -->
  <path d="M 390 340 L 300 340 L 300 358" stroke="#38a169" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-green)"/>

  <!-- Memory System Box -->
  <rect x="100" y="480" width="700" height="160" rx="8" fill="#fff" stroke="#805ad5" stroke-width="2"/>
  <rect x="100" y="480" width="700" height="30" rx="8" fill="#805ad5"/>
  <rect x="100" y="502" width="700" height="8" fill="#805ad5"/>
  <text x="450" y="500" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="600" fill="#fff">Memory System (memory_pipeline.py)</text>

  <!-- Short-term Buffer -->
  <rect x="120" y="520" width="150" height="100" rx="4" fill="#faf5ff" stroke="#805ad5" stroke-width="1"/>
  <text x="195" y="540" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#553c9a">Short-term Buffer</text>
  <text x="195" y="560" text-anchor="middle" font-family="system-ui" font-size="10" fill="#718096">Sliding Window</text>
  <text x="195" y="575" text-anchor="middle" font-family="system-ui" font-size="10" fill="#718096">Recent 10 turns</text>
  <rect x="135" y="585" width="120" height="25" rx="2" fill="#e9d8fd" stroke="#805ad5" stroke-width="0.5"/>
  <text x="195" y="602" text-anchor="middle" font-family="monospace" font-size="9" fill="#553c9a">add_turn()</text>

  <!-- LLM Summarize -->
  <rect x="290" y="520" width="130" height="100" rx="4" fill="#fefcbf" stroke="#d69e2e" stroke-width="1"/>
  <text x="355" y="540" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#744210">LLM Summarize</text>
  <text x="355" y="560" text-anchor="middle" font-family="system-ui" font-size="10" fill="#718096">Conversation</text>
  <text x="355" y="575" text-anchor="middle" font-family="system-ui" font-size="10" fill="#718096">→ Memory</text>
  <rect x="300" y="585" width="110" height="25" rx="2" fill="#faf089" stroke="#d69e2e" stroke-width="0.5"/>
  <text x="355" y="602" text-anchor="middle" font-family="monospace" font-size="9" fill="#744210">_archive_buffer()</text>

  <!-- Milvus Store -->
  <rect x="440" y="520" width="150" height="100" rx="4" fill="#bee3f8" stroke="#3182ce" stroke-width="1"/>
  <text x="515" y="540" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#2c5282">Milvus Store</text>
  <text x="515" y="560" text-anchor="middle" font-family="system-ui" font-size="10" fill="#718096">Vector + Keyword</text>
  <text x="515" y="575" text-anchor="middle" font-family="system-ui" font-size="10" fill="#718096">Hybrid Search</text>
  <rect x="455" y="585" width="120" height="25" rx="2" fill="#90cdf4" stroke="#3182ce" stroke-width="0.5"/>
  <text x="515" y="602" text-anchor="middle" font-family="monospace" font-size="9" fill="#2c5282">hybrid_search()</text>

  <!-- Dreaming Service -->
  <rect x="610" y="520" width="170" height="100" rx="4" fill="#fed7e2" stroke="#d53f8c" stroke-width="1"/>
  <text x="695" y="540" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#97266d">Dreaming Service</text>
  <text x="695" y="560" text-anchor="middle" font-family="system-ui" font-size="10" fill="#718096">episodic → semantic</text>
  <text x="695" y="575" text-anchor="middle" font-family="system-ui" font-size="10" fill="#718096">Clustering, Dedup</text>
  <rect x="625" y="585" width="140" height="25" rx="2" fill="#fbb6ce" stroke="#d53f8c" stroke-width="0.5"/>
  <text x="695" y="602" text-anchor="middle" font-family="monospace" font-size="9" fill="#97266d">_extract_insights()</text>

  <!-- Memory System Arrows -->
  <line x1="270" y1="570" x2="288" y2="570" stroke="#805ad5" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="570" x2="438" y2="570" stroke="#d69e2e" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="570" x2="608" y2="570" stroke="#3182ce" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Connection: CEO to Memory (Write) -->
  <path d="M 245 440 L 245 478" stroke="#38a169" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
  <text x="260" y="460" font-family="system-ui" font-size="9" fill="#38a169">write</text>

  <!-- Connection: Memory to CEO (Read) -->
  <path d="M 195 520 L 195 478 L 195 460 L 140 460 L 140 255" stroke="#3182ce" stroke-width="2" fill="none" marker-end="url(#arrowhead-blue)"/>
  <text x="130" y="478" font-family="system-ui" font-size="9" fill="#3182ce">read</text>

  <!-- Output Arrow -->
  <line x1="450" y1="450" x2="450" y2="465" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="380" y="455" width="140" height="20" rx="3" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
  <text x="450" y="469" text-anchor="middle" font-family="system-ui" font-size="10" fill="#4a5568">TaskResult</text>

  <!-- Legend -->
  <rect x="100" y="655" width="700" height="35" rx="4" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="130" cy="672" r="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1"/>
  <text x="145" y="676" font-family="system-ui" font-size="10" fill="#4a5568">Memory Read</text>
  <circle cx="240" cy="672" r="6" fill="#f0fff4" stroke="#38a169" stroke-width="1"/>
  <text x="255" y="676" font-family="system-ui" font-size="10" fill="#4a5568">Memory Write</text>
  <circle cx="360" cy="672" r="6" fill="#fff5f5" stroke="#c53030" stroke-width="1"/>
  <text x="375" y="676" font-family="system-ui" font-size="10" fill="#4a5568">Review Loop</text>
  <circle cx="480" cy="672" r="6" fill="#faf5ff" stroke="#805ad5" stroke-width="1"/>
  <text x="495" y="676" font-family="system-ui" font-size="10" fill="#4a5568">Memory System</text>
  <rect x="590" y="666" width="30" height="12" rx="2" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="630" y="676" font-family="system-ui" font-size="10" fill="#4a5568">Integration Point</text>
</svg>