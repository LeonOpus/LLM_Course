<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" style="background: linear-gradient(180deg, #0d0d1a 0%, #1a1a2e 100%);">
  <defs>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="orangeG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="pinkG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="redG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow3" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#6366f1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#10b981"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#f59e0b"/>
    </marker>
  </defs>
  
  <!-- 标题 -->
  <text x="700" y="40" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold">LangGraph 多智能体工作流 (含 ReAct 反思)</text>
  <text x="700" y="70" text-anchor="middle" fill="#9ca3af" font-size="14">金融研报自动化分析师 - 核心架构</text>
  
  <!-- START 节点 -->
  <g transform="translate(650, 100)">
    <circle cx="50" cy="30" r="25" fill="#1e1e32" stroke="#4ade80" stroke-width="3"/>
    <text x="50" y="35" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="bold">START</text>
  </g>
  <line x1="700" y1="155" x2="700" y2="185" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  
  <!-- Router Node -->
  <g transform="translate(550, 195)">
    <rect x="0" y="0" width="300" height="100" rx="15" fill="#1e1e32" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow3)"/>
    <circle cx="35" cy="30" r="20" fill="url(#purpleG)" filter="url(#glow)"/>
    <text x="35" y="35" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">1</text>
    <text x="70" y="35" fill="#8b5cf6" font-size="18" font-weight="bold">Router Node</text>
    <text x="20" y="60" fill="#9ca3af" font-size="12">意图识别：</text>
    <text x="20" y="80" fill="#c4b5fd" font-size="11">data_query | analysis | research | general</text>
  </g>
  <line x1="700" y1="305" x2="700" y2="335" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow3)"/>
  
  <!-- Planner Node -->
  <g transform="translate(550, 345)">
    <rect x="0" y="0" width="300" height="100" rx="15" fill="#1e1e32" stroke="#3b82f6" stroke-width="2" filter="url(#shadow3)"/>
    <circle cx="35" cy="30" r="20" fill="url(#blueG)" filter="url(#glow)"/>
    <text x="35" y="35" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">2</text>
    <text x="70" y="35" fill="#3b82f6" font-size="18" font-weight="bold">Planner Node</text>
    <text x="20" y="60" fill="#9ca3af" font-size="12">任务规划：</text>
    <text x="20" y="80" fill="#93c5fd" font-size="11">生成多步执行计划 [{step, tool, params}]</text>
  </g>
  <line x1="700" y1="455" x2="700" y2="485" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow3)"/>
  
  <!-- Executor Node (带循环) -->
  <g transform="translate(550, 495)">
    <rect x="0" y="0" width="300" height="120" rx="15" fill="#1e1e32" stroke="#10b981" stroke-width="2" filter="url(#shadow3)"/>
    <circle cx="35" cy="30" r="20" fill="url(#greenG)" filter="url(#glow)"/>
    <text x="35" y="35" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">3</text>
    <text x="70" y="35" fill="#10b981" font-size="18" font-weight="bold">Executor Node</text>
    <text x="20" y="60" fill="#9ca3af" font-size="12">工具执行：</text>
    <text x="20" y="80" fill="#6ee7b7" font-size="10">• text2sql → 数据库查询</text>
    <text x="20" y="95" fill="#6ee7b7" font-size="10">• code_executor → Python分析</text>
    <text x="20" y="110" fill="#6ee7b7" font-size="10">• web_search / rag_search / pdf_parser</text>
  </g>
  
  <!-- Executor 循环箭头 -->
  <path d="M 860 555 Q 920 555 920 520 Q 920 485 860 485" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <text x="935" y="520" fill="#10b981" font-size="10">循环执行</text>
  <text x="935" y="535" fill="#10b981" font-size="10">每个步骤</text>
  
  <line x1="700" y1="625" x2="700" y2="655" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  
  <!-- Reflector Node (ReAct) -->
  <g transform="translate(550, 665)">
    <rect x="0" y="0" width="300" height="120" rx="15" fill="#1e1e32" stroke="#f59e0b" stroke-width="3" filter="url(#shadow3)"/>
    <circle cx="35" cy="30" r="20" fill="url(#orangeG)" filter="url(#glow)"/>
    <text x="35" y="35" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">4</text>
    <text x="70" y="35" fill="#f59e0b" font-size="18" font-weight="bold">Reflector Node</text>
    <rect x="180" y="15" width="100" height="25" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="230" y="32" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">ReAct 反思</text>
    <text x="20" y="60" fill="#9ca3af" font-size="12">自我评估：</text>
    <text x="20" y="78" fill="#fcd34d" font-size="10">• 结果是否完整回答问题？</text>
    <text x="20" y="93" fill="#fcd34d" font-size="10">• 是否需要额外数据/分析？</text>
    <text x="20" y="108" fill="#fcd34d" font-size="10">• 置信度评估 (0.0 - 1.0)</text>
  </g>
  
  <!-- ReAct 循环 - 返回 Planner -->
  <path d="M 540 725 Q 450 725 450 550 Q 450 375 540 375" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <rect x="350" y="530" width="90" height="40" rx="8" fill="#1e1e32" stroke="#f59e0b" stroke-width="1"/>
  <text x="395" y="545" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="bold">需要改进?</text>
  <text x="395" y="560" text-anchor="middle" fill="#fbbf24" font-size="9">重新规划</text>
  
  <!-- 向下到 Critic -->
  <line x1="700" y1="795" x2="700" y2="825" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="750" y="815" fill="#9ca3af" font-size="10">完成分析</text>
  
  <!-- Critic Node -->
  <g transform="translate(550, 835)">
    <rect x="0" y="0" width="300" height="100" rx="15" fill="#1e1e32" stroke="#ec4899" stroke-width="2" filter="url(#shadow3)"/>
    <circle cx="35" cy="30" r="20" fill="url(#pinkG)" filter="url(#glow)"/>
    <text x="35" y="35" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">5</text>
    <text x="70" y="35" fill="#ec4899" font-size="18" font-weight="bold">Critic Node</text>
    <text x="20" y="60" fill="#9ca3af" font-size="12">生成最终答案：</text>
    <text x="20" y="80" fill="#f9a8d4" font-size="11">整合所有结果，生成专业回复</text>
  </g>
  <line x1="700" y1="945" x2="700" y2="970" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow3)"/>
  
  <!-- END 节点 -->
  <g transform="translate(650, 975)">
    <circle cx="50" cy="0" r="20" fill="#1e1e32" stroke="#ef4444" stroke-width="3"/>
    <text x="50" y="5" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="bold">END</text>
  </g>
  
  <!-- 右侧工具面板 -->
  <g transform="translate(950, 195)">
    <rect x="0" y="0" width="380" height="380" rx="15" fill="#12121f" stroke="#374151" stroke-width="1"/>
    <text x="20" y="30" fill="#06b6d4" font-size="16" font-weight="bold">🔧 工具注册表 (Tool Registry)</text>
    
    <!-- Text2SQL -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="160" height="70" rx="8" fill="#1e1e32" stroke="#8b5cf6" stroke-width="1"/>
      <rect x="10" y="10" width="30" height="20" rx="4" fill="#8b5cf6"/>
      <text x="25" y="24" text-anchor="middle" fill="#fff" font-size="10">SQL</text>
      <text x="50" y="24" fill="#a78bfa" font-size="12" font-weight="bold">Text2SQL</text>
      <text x="10" y="45" fill="#9ca3af" font-size="9">自然语言 → SQL</text>
      <text x="10" y="58" fill="#9ca3af" font-size="9">查询数据库</text>
    </g>
    
    <!-- Code Executor -->
    <g transform="translate(200, 50)">
      <rect x="0" y="0" width="160" height="70" rx="8" fill="#1e1e32" stroke="#10b981" stroke-width="1"/>
      <rect x="10" y="10" width="30" height="20" rx="4" fill="#10b981"/>
      <text x="25" y="24" text-anchor="middle" fill="#fff" font-size="10">Py</text>
      <text x="50" y="24" fill="#6ee7b7" font-size="12" font-weight="bold">代码执行器</text>
      <text x="10" y="45" fill="#9ca3af" font-size="9">Python 数据分析</text>
      <text x="10" y="58" fill="#9ca3af" font-size="9">图表可视化</text>
    </g>
    
    <!-- PDF Parser -->
    <g transform="translate(20, 135)">
      <rect x="0" y="0" width="160" height="70" rx="8" fill="#1e1e32" stroke="#ef4444" stroke-width="1"/>
      <rect x="10" y="10" width="30" height="20" rx="4" fill="#ef4444"/>
      <text x="25" y="24" text-anchor="middle" fill="#fff" font-size="10">PDF</text>
      <text x="50" y="24" fill="#fca5a5" font-size="12" font-weight="bold">PDF解析器</text>
      <text x="10" y="45" fill="#9ca3af" font-size="9">研报文档解析</text>
      <text x="10" y="58" fill="#9ca3af" font-size="9">DocMind API</text>
    </g>
    
    <!-- Web Search -->
    <g transform="translate(200, 135)">
      <rect x="0" y="0" width="160" height="70" rx="8" fill="#1e1e32" stroke="#3b82f6" stroke-width="1"/>
      <rect x="10" y="10" width="30" height="20" rx="4" fill="#3b82f6"/>
      <text x="25" y="24" text-anchor="middle" fill="#fff" font-size="10">🔍</text>
      <text x="50" y="24" fill="#93c5fd" font-size="12" font-weight="bold">网络搜索</text>
      <text x="10" y="45" fill="#9ca3af" font-size="9">实时市场信息</text>
      <text x="10" y="58" fill="#9ca3af" font-size="9">博查 API</text>
    </g>
    
    <!-- RAG Search -->
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="160" height="70" rx="8" fill="#1e1e32" stroke="#f59e0b" stroke-width="1"/>
      <rect x="10" y="10" width="30" height="20" rx="4" fill="#f59e0b"/>
      <text x="25" y="24" text-anchor="middle" fill="#fff" font-size="10">RAG</text>
      <text x="50" y="24" fill="#fcd34d" font-size="12" font-weight="bold">RAG检索</text>
      <text x="10" y="45" fill="#9ca3af" font-size="9">语义向量检索</text>
      <text x="10" y="58" fill="#9ca3af" font-size="9">text-embedding-v4</text>
    </g>
    
    <!-- LLM -->
    <g transform="translate(200, 220)">
      <rect x="0" y="0" width="160" height="70" rx="8" fill="#1e1e32" stroke="#ec4899" stroke-width="1"/>
      <rect x="10" y="10" width="30" height="20" rx="4" fill="#ec4899"/>
      <text x="25" y="24" text-anchor="middle" fill="#fff" font-size="10">AI</text>
      <text x="50" y="24" fill="#f9a8d4" font-size="12" font-weight="bold">qwen-max</text>
      <text x="10" y="45" fill="#9ca3af" font-size="9">大语言模型</text>
      <text x="10" y="58" fill="#9ca3af" font-size="9">阿里云 DashScope</text>
    </g>
    
    <!-- 数据库 -->
    <g transform="translate(20, 305)">
      <rect x="0" y="0" width="340" height="55" rx="8" fill="#1e1e32" stroke="#06b6d4" stroke-width="1"/>
      <rect x="10" y="10" width="30" height="20" rx="4" fill="#06b6d4"/>
      <text x="25" y="24" text-anchor="middle" fill="#fff" font-size="10">DB</text>
      <text x="50" y="24" fill="#22d3ee" font-size="12" font-weight="bold">SQLite 金融数据库</text>
      <text x="10" y="45" fill="#9ca3af" font-size="9">stocks | financials | market_data | research_reports</text>
    </g>
  </g>
  
  <!-- 左侧状态面板 -->
  <g transform="translate(50, 195)">
    <rect x="0" y="0" width="380" height="220" rx="15" fill="#12121f" stroke="#374151" stroke-width="1"/>
    <text x="20" y="30" fill="#a78bfa" font-size="16" font-weight="bold">📊 Agent State (状态管理)</text>
    
    <text x="20" y="60" fill="#60a5fa" font-size="11" font-family="monospace">messages: List[Dict]</text>
    <text x="200" y="60" fill="#6b7280" font-size="10">对话历史</text>
    
    <text x="20" y="80" fill="#60a5fa" font-size="11" font-family="monospace">query: str</text>
    <text x="200" y="80" fill="#6b7280" font-size="10">用户问题</text>
    
    <text x="20" y="100" fill="#60a5fa" font-size="11" font-family="monospace">intent: str</text>
    <text x="200" y="100" fill="#6b7280" font-size="10">识别的意图</text>
    
    <text x="20" y="120" fill="#60a5fa" font-size="11" font-family="monospace">plan: List[Dict]</text>
    <text x="200" y="120" fill="#6b7280" font-size="10">执行计划</text>
    
    <text x="20" y="140" fill="#60a5fa" font-size="11" font-family="monospace">tool_results: List[Dict]</text>
    <text x="200" y="140" fill="#6b7280" font-size="10">工具执行结果</text>
    
    <text x="20" y="160" fill="#60a5fa" font-size="11" font-family="monospace">reasoning_steps: List[str]</text>
    <text x="200" y="160" fill="#6b7280" font-size="10">推理步骤</text>
    
    <text x="20" y="180" fill="#f59e0b" font-size="11" font-family="monospace">reflections: List[Dict]</text>
    <text x="200" y="180" fill="#6b7280" font-size="10">反思记录</text>
    
    <text x="20" y="200" fill="#10b981" font-size="11" font-family="monospace">final_answer: str</text>
    <text x="200" y="200" fill="#6b7280" font-size="10">最终答案</text>
  </g>
  
  <!-- 左下角 ReAct 说明 -->
  <g transform="translate(50, 445)">
    <rect x="0" y="0" width="380" height="160" rx="15" fill="#12121f" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="30" fill="#f59e0b" font-size="16" font-weight="bold">🔄 ReAct 反思机制</text>
    
    <text x="20" y="60" fill="#d1d5db" font-size="11">Reasoning (推理):</text>
    <text x="150" y="60" fill="#fcd34d" font-size="10">分析当前结果是否满足需求</text>
    
    <text x="20" y="85" fill="#d1d5db" font-size="11">Acting (行动):</text>
    <text x="150" y="85" fill="#fcd34d" font-size="10">决定是否需要执行额外步骤</text>
    
    <text x="20" y="110" fill="#d1d5db" font-size="11">Iteration (迭代):</text>
    <text x="150" y="110" fill="#fcd34d" font-size="10">最多 3 轮反思循环</text>
    
    <text x="20" y="135" fill="#d1d5db" font-size="11">Confidence (置信度):</text>
    <text x="150" y="135" fill="#fcd34d" font-size="10">&gt; 0.85 时结束反思</text>
  </g>
</svg>
