<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" style="background: linear-gradient(180deg, #0d0d1a 0%, #1a1a2e 100%);">
  <defs>
    <linearGradient id="purpleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="greenGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="orangeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="pinkGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="redGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <filter id="cardShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
  </defs>
  
  <!-- 标题 -->
  <text x="700" y="45" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold" font-family="Arial, sans-serif">代码解释器 (Code Interpreter) 完整工作流程</text>
  <text x="700" y="75" text-anchor="middle" fill="#9ca3af" font-size="14" font-family="Arial, sans-serif">安全执行 Python 代码进行数据分析和可视化</text>
  
  <!-- ========== 第一行：步骤 1-4 ========== -->
  
  <!-- 步骤1: 用户请求 -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="260" height="140" rx="12" fill="#1e1e32" stroke="#8b5cf6" stroke-width="2" filter="url(#cardShadow2)"/>
    <circle cx="30" cy="25" r="16" fill="url(#purpleGrad2)"/>
    <text x="30" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">1</text>
    <text x="60" y="30" fill="#8b5cf6" font-size="16" font-weight="bold" font-family="Arial">用户请求</text>
    <text x="15" y="55" fill="#9ca3af" font-size="12">分析需求：</text>
    <rect x="15" y="70" width="230" height="55" rx="6" fill="#252538"/>
    <text x="25" y="90" fill="#a78bfa" font-size="11">"帮我分析银行股的PE分布，</text>
    <text x="25" y="105" fill="#a78bfa" font-size="11">并画一个柱状图"</text>
    <text x="25" y="120" fill="#6b7280" font-size="10">→ 需要: 数据查询 + 计算 + 可视化</text>
  </g>
  
  <line x1="350" y1="180" x2="390" y2="180" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- 步骤2: LLM 生成代码 -->
  <g transform="translate(400, 110)">
    <rect x="0" y="0" width="260" height="140" rx="12" fill="#1e1e32" stroke="#3b82f6" stroke-width="2" filter="url(#cardShadow2)"/>
    <circle cx="30" cy="25" r="16" fill="url(#blueGrad2)"/>
    <text x="30" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">2</text>
    <text x="60" y="30" fill="#3b82f6" font-size="16" font-weight="bold">LLM 生成代码</text>
    <text x="15" y="55" fill="#9ca3af" font-size="12">qwen-max 生成 Python：</text>
    <rect x="15" y="70" width="230" height="55" rx="6" fill="#252538"/>
    <text x="25" y="88" fill="#60a5fa" font-size="10" font-family="monospace">df = pd.DataFrame(data)</text>
    <text x="25" y="103" fill="#60a5fa" font-size="10" font-family="monospace">plt.bar(df['name'], df['pe'])</text>
    <text x="25" y="118" fill="#60a5fa" font-size="10" font-family="monospace">plt.title('银行股PE分布')</text>
  </g>
  
  <line x1="670" y1="180" x2="710" y2="180" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- 步骤3: 安全检查 -->
  <g transform="translate(720, 110)">
    <rect x="0" y="0" width="260" height="140" rx="12" fill="#1e1e32" stroke="#ef4444" stroke-width="2" filter="url(#cardShadow2)"/>
    <circle cx="30" cy="25" r="16" fill="url(#redGrad2)"/>
    <text x="30" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">3</text>
    <text x="60" y="30" fill="#ef4444" font-size="16" font-weight="bold">安全检查</text>
    <text x="15" y="55" fill="#9ca3af" font-size="12">代码审查：</text>
    <text x="20" y="78" fill="#4ade80" font-size="11">✓ 无 os/subprocess 调用</text>
    <text x="20" y="95" fill="#4ade80" font-size="11">✓ 无文件系统操作</text>
    <text x="20" y="112" fill="#4ade80" font-size="11">✓ 无网络请求</text>
    <text x="20" y="129" fill="#f87171" font-size="11">✗ 禁止 eval/exec/__import__</text>
  </g>
  
  <line x1="990" y1="180" x2="1030" y2="180" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- 步骤4: 代码预处理 -->
  <g transform="translate(1040, 110)">
    <rect x="0" y="0" width="260" height="140" rx="12" fill="#1e1e32" stroke="#f59e0b" stroke-width="2" filter="url(#cardShadow2)"/>
    <circle cx="30" cy="25" r="16" fill="url(#orangeGrad2)"/>
    <text x="30" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">4</text>
    <text x="60" y="30" fill="#f59e0b" font-size="16" font-weight="bold">代码预处理</text>
    <text x="15" y="55" fill="#9ca3af" font-size="12">移除冗余 import：</text>
    <rect x="15" y="70" width="230" height="55" rx="6" fill="#252538"/>
    <text x="25" y="88" fill="#fbbf24" font-size="10" font-family="monospace">
      <tspan fill="#6b7280">
        <tspan style="text-decoration:line-through">import pandas as pd</tspan>
      </tspan>
    </text>
    <text x="25" y="103" fill="#fbbf24" font-size="10">↳ 已预加载: pd, np, plt</text>
    <text x="25" y="118" fill="#9ca3af" font-size="10">保留业务逻辑代码</text>
  </g>
  
  <!-- 向下箭头 -->
  <path d="M 1170 260 L 1170 290 L 1170 320" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- ========== 第二行：步骤 5-8 (从右到左) ========== -->
  
  <!-- 步骤5: 沙箱执行 -->
  <g transform="translate(1040, 330)">
    <rect x="0" y="0" width="260" height="140" rx="12" fill="#1e1e32" stroke="#10b981" stroke-width="2" filter="url(#cardShadow2)"/>
    <circle cx="30" cy="25" r="16" fill="url(#greenGrad2)"/>
    <text x="30" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">5</text>
    <text x="60" y="30" fill="#10b981" font-size="16" font-weight="bold">沙箱执行</text>
    <text x="15" y="55" fill="#9ca3af" font-size="12">安全环境运行：</text>
    <rect x="15" y="70" width="230" height="55" rx="6" fill="#252538"/>
    <text x="25" y="88" fill="#34d399" font-size="10">safe_globals = {</text>
    <text x="25" y="103" fill="#34d399" font-size="10">  'pd': pandas, 'np': numpy,</text>
    <text x="25" y="118" fill="#34d399" font-size="10">  'plt': matplotlib.pyplot }</text>
  </g>
  
  <line x1="1030" y1="400" x2="990" y2="400" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- 步骤6: 捕获输出 -->
  <g transform="translate(720, 330)">
    <rect x="0" y="0" width="260" height="140" rx="12" fill="#1e1e32" stroke="#06b6d4" stroke-width="2" filter="url(#cardShadow2)"/>
    <circle cx="30" cy="25" r="16" fill="url(#cyanGrad2)"/>
    <text x="30" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">6</text>
    <text x="60" y="30" fill="#06b6d4" font-size="16" font-weight="bold">捕获输出</text>
    <text x="15" y="55" fill="#9ca3af" font-size="12">收集执行结果：</text>
    <rect x="20" y="72" width="18" height="14" rx="2" fill="#3b82f6"/>
    <text x="45" y="83" fill="#93c5fd" font-size="11">stdout 文本输出</text>
    <rect x="20" y="92" width="18" height="14" rx="2" fill="#10b981"/>
    <text x="45" y="103" fill="#6ee7b7" font-size="11">stderr 错误信息</text>
    <rect x="20" y="112" width="18" height="14" rx="2" fill="#f59e0b"/>
    <text x="45" y="123" fill="#fcd34d" font-size="11">matplotlib 图表</text>
  </g>
  
  <line x1="710" y1="400" x2="670" y2="400" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- 步骤7: 图表处理 -->
  <g transform="translate(400, 330)">
    <rect x="0" y="0" width="260" height="140" rx="12" fill="#1e1e32" stroke="#ec4899" stroke-width="2" filter="url(#cardShadow2)"/>
    <circle cx="30" cy="25" r="16" fill="url(#pinkGrad2)"/>
    <text x="30" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">7</text>
    <text x="60" y="30" fill="#ec4899" font-size="16" font-weight="bold">图表处理</text>
    <text x="15" y="55" fill="#9ca3af" font-size="12">图形转换：</text>
    <rect x="15" y="70" width="230" height="55" rx="6" fill="#252538"/>
    <text x="25" y="88" fill="#f472b6" font-size="10" font-family="monospace">fig.savefig(buffer, format='png')</text>
    <text x="25" y="103" fill="#f472b6" font-size="10" font-family="monospace">base64.b64encode(buffer)</text>
    <text x="25" y="118" fill="#9ca3af" font-size="10">→ 转为 Base64 字符串</text>
  </g>
  
  <line x1="390" y1="400" x2="350" y2="400" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- 步骤8: 返回结果 -->
  <g transform="translate(80, 330)">
    <rect x="0" y="0" width="260" height="140" rx="12" fill="#1e1e32" stroke="#8b5cf6" stroke-width="2" filter="url(#cardShadow2)"/>
    <circle cx="30" cy="25" r="16" fill="url(#purpleGrad2)"/>
    <text x="30" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">8</text>
    <text x="60" y="30" fill="#8b5cf6" font-size="16" font-weight="bold">返回结果</text>
    <text x="15" y="55" fill="#9ca3af" font-size="12">完整响应：</text>
    <rect x="15" y="70" width="230" height="55" rx="6" fill="#252538"/>
    <text x="25" y="88" fill="#a78bfa" font-size="10" font-family="monospace">{ "success": true,</text>
    <text x="25" y="103" fill="#a78bfa" font-size="10" font-family="monospace">  "output": "...",</text>
    <text x="25" y="118" fill="#a78bfa" font-size="10" font-family="monospace">  "figures": [base64...] }</text>
  </g>
  
  <!-- ========== 沙箱安全机制详解 ========== -->
  <g transform="translate(50, 510)">
    <text x="0" y="0" fill="#10b981" font-size="18" font-weight="bold">🔒 沙箱安全机制</text>
    
    <!-- 允许的操作 -->
    <rect x="0" y="20" width="420" height="160" rx="8" fill="#1e1e32" stroke="#10b981" stroke-width="1"/>
    <text x="15" y="45" fill="#10b981" font-size="14" font-weight="bold">✓ 允许的操作</text>
    <text x="20" y="70" fill="#d1d5db" font-size="11">预加载库:</text>
    <text x="100" y="70" fill="#60a5fa" font-size="11" font-family="monospace">pd (pandas), np (numpy), plt (matplotlib)</text>
    <text x="20" y="90" fill="#d1d5db" font-size="11">内置函数:</text>
    <text x="100" y="90" fill="#60a5fa" font-size="11" font-family="monospace">print, len, range, sum, min, max, sorted...</text>
    <text x="20" y="110" fill="#d1d5db" font-size="11">数据类型:</text>
    <text x="100" y="110" fill="#60a5fa" font-size="11" font-family="monospace">int, float, str, list, dict, tuple, set</text>
    <text x="20" y="130" fill="#d1d5db" font-size="11">其他模块:</text>
    <text x="100" y="130" fill="#60a5fa" font-size="11" font-family="monospace">json, math, datetime, statistics</text>
    <text x="20" y="155" fill="#9ca3af" font-size="10">注: 用户代码中的 import 语句会被自动移除，直接使用预加载变量</text>
    
    <!-- 禁止的操作 -->
    <rect x="440" y="20" width="420" height="160" rx="8" fill="#1e1e32" stroke="#ef4444" stroke-width="1"/>
    <text x="455" y="45" fill="#ef4444" font-size="14" font-weight="bold">✗ 禁止的操作</text>
    <text x="460" y="70" fill="#d1d5db" font-size="11">危险模块:</text>
    <text x="540" y="70" fill="#f87171" font-size="11" font-family="monospace">os, subprocess, shutil, sys, socket</text>
    <text x="460" y="90" fill="#d1d5db" font-size="11">网络相关:</text>
    <text x="540" y="90" fill="#f87171" font-size="11" font-family="monospace">requests, urllib, http, ftplib, smtplib</text>
    <text x="460" y="110" fill="#d1d5db" font-size="11">危险函数:</text>
    <text x="540" y="110" fill="#f87171" font-size="11" font-family="monospace">eval(), exec(), compile(), open()</text>
    <text x="460" y="130" fill="#d1d5db" font-size="11">动态导入:</text>
    <text x="540" y="130" fill="#f87171" font-size="11" font-family="monospace">__import__, importlib</text>
    <text x="460" y="155" fill="#9ca3af" font-size="10">检测到以上操作将立即拒绝执行并返回错误</text>
    
    <!-- 资源限制 -->
    <rect x="880" y="20" width="420" height="160" rx="8" fill="#1e1e32" stroke="#f59e0b" stroke-width="1"/>
    <text x="895" y="45" fill="#f59e0b" font-size="14" font-weight="bold">⚡ 资源限制</text>
    <text x="900" y="70" fill="#d1d5db" font-size="11">执行超时:</text>
    <text x="1000" y="70" fill="#fbbf24" font-size="11">30 秒</text>
    <text x="900" y="90" fill="#d1d5db" font-size="11">输出长度:</text>
    <text x="1000" y="90" fill="#fbbf24" font-size="11">最大 10,000 字符</text>
    <text x="900" y="110" fill="#d1d5db" font-size="11">图表数量:</text>
    <text x="1000" y="110" fill="#fbbf24" font-size="11">自动收集所有 figure</text>
    <text x="900" y="130" fill="#d1d5db" font-size="11">内存限制:</text>
    <text x="1000" y="130" fill="#fbbf24" font-size="11">由系统环境控制</text>
    <text x="900" y="155" fill="#9ca3af" font-size="10">超出限制将终止执行并返回部分结果</text>
  </g>
  
  <!-- ========== 代码示例 ========== -->
  <g transform="translate(50, 710)">
    <rect x="0" y="0" width="20" height="20" rx="3" fill="#3b82f6"/>
    <text x="30" y="16" fill="#3b82f6" font-size="18" font-weight="bold">代码执行示例</text>
    
    <rect x="0" y="35" width="640" height="190" rx="10" fill="#12121f" stroke="#374151" stroke-width="1"/>
    <text x="20" y="60" fill="#f87171" font-size="13" font-weight="bold" font-family="monospace"># 用户输入的代码</text>
    <text x="20" y="85" fill="#60a5fa" font-size="11" font-family="monospace">import pandas as pd</text>
    <text x="200" y="85" fill="#6b7280" font-size="10">← 会被自动移除</text>
    <text x="20" y="105" fill="#60a5fa" font-size="11" font-family="monospace">import matplotlib.pyplot as plt</text>
    <text x="280" y="105" fill="#6b7280" font-size="10">← 会被自动移除</text>
    <text x="20" y="130" fill="#d1d5db" font-size="11" font-family="monospace">data = {'股票': ['工行', '招行', '农行'], 'PE': [5.2, 7.5, 4.8]}</text>
    <text x="20" y="150" fill="#d1d5db" font-size="11" font-family="monospace">df = pd.DataFrame(data)</text>
    <text x="240" y="150" fill="#6b7280" font-size="10">← 使用预加载的 pd</text>
    <text x="20" y="170" fill="#d1d5db" font-size="11" font-family="monospace">plt.bar(df['股票'], df['PE'])</text>
    <text x="20" y="190" fill="#d1d5db" font-size="11" font-family="monospace">plt.title('银行股PE对比')</text>
    <text x="20" y="210" fill="#d1d5db" font-size="11" font-family="monospace">print(df)</text>
    
    <!-- 执行结果 -->
    <rect x="660" y="35" width="640" height="190" rx="10" fill="#12121f" stroke="#374151" stroke-width="1"/>
    <text x="680" y="60" fill="#10b981" font-size="13" font-weight="bold" font-family="monospace"># 执行结果</text>
    <text x="680" y="85" fill="#d1d5db" font-size="11" font-family="monospace">{</text>
    <text x="700" y="105" fill="#fbbf24" font-size="11" font-family="monospace">"success"</text>
    <text x="770" y="105" fill="#d1d5db" font-size="11" font-family="monospace">: true,</text>
    <text x="700" y="125" fill="#fbbf24" font-size="11" font-family="monospace">"output"</text>
    <text x="760" y="125" fill="#d1d5db" font-size="11" font-family="monospace">: "  股票   PE\n0  工行  5.2\n1  招行  7.5...",</text>
    <text x="700" y="145" fill="#fbbf24" font-size="11" font-family="monospace">"figures"</text>
    <text x="770" y="145" fill="#d1d5db" font-size="11" font-family="monospace">: [{ "base64": "iVBORw0KGgo...", "format": "png" }],</text>
    <text x="700" y="165" fill="#fbbf24" font-size="11" font-family="monospace">"variables"</text>
    <text x="785" y="165" fill="#d1d5db" font-size="11" font-family="monospace">: { "df": {...} },</text>
    <text x="700" y="185" fill="#fbbf24" font-size="11" font-family="monospace">"error"</text>
    <text x="755" y="185" fill="#d1d5db" font-size="11" font-family="monospace">: ""</text>
    <text x="680" y="210" fill="#d1d5db" font-size="11" font-family="monospace">}</text>
  </g>
</svg>
