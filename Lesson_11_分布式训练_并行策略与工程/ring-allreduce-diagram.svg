<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
  <!-- 定义箭头 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="scatter-arrow" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc" />
    </marker>
    <marker id="gather-arrow" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc0000" />
    </marker>
  </defs>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">Ring-AllReduce 通信模式</text>
  <text x="400" y="70" text-anchor="middle" font-family="Arial" font-size="16" fill="#666">高效的分布式梯度同步方法</text>
  
  <!-- 画环形结构 -->
  <g transform="translate(400, 250)">
    <circle cx="0" cy="0" r="150" fill="none" stroke="#ddd" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- GPU1 -->
    <g transform="translate(0, -150)">
      <rect x="-40" y="-40" width="80" height="80" rx="5" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
      <rect x="-25" y="-25" width="50" height="35" rx="2" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <circle cx="-10" cy="20" r="5" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <circle cx="0" cy="20" r="5" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <circle cx="10" cy="20" r="5" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <text x="0" y="-50" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">GPU 1</text>
    </g>
    
    <!-- GPU2 -->
    <g transform="translate(150, 0)">
      <rect x="-40" y="-40" width="80" height="80" rx="5" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
      <rect x="-25" y="-25" width="50" height="35" rx="2" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <circle cx="-10" cy="20" r="5" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <circle cx="0" cy="20" r="5" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <circle cx="10" cy="20" r="5" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <text x="50" y="0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">GPU 2</text>
    </g>
    
    <!-- GPU3 -->
    <g transform="translate(0, 150)">
      <rect x="-40" y="-40" width="80" height="80" rx="5" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
      <rect x="-25" y="-25" width="50" height="35" rx="2" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <circle cx="-10" cy="20" r="5" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <circle cx="0" cy="20" r="5" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <circle cx="10" cy="20" r="5" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <text x="0" y="50" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">GPU 3</text>
    </g>
    
    <!-- GPU4 -->
    <g transform="translate(-150, 0)">
      <rect x="-40" y="-40" width="80" height="80" rx="5" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
      <rect x="-25" y="-25" width="50" height="35" rx="2" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <circle cx="-10" cy="20" r="5" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <circle cx="0" cy="20" r="5" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <circle cx="10" cy="20" r="5" fill="#f8f8f8" stroke="#333" stroke-width="1.5"/>
      <text x="-50" y="0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">GPU 4</text>
    </g>
    
    <!-- Scatter阶段箭头 -->
    <path d="M0 -110 A 120 120 0 0 1 110 0" fill="none" stroke="#0066cc" stroke-width="3" stroke-dasharray="10,5" marker-end="url(#scatter-arrow)"/>
    <path d="M110 0 A 120 120 0 0 1 0 110" fill="none" stroke="#0066cc" stroke-width="3" stroke-dasharray="10,5" marker-end="url(#scatter-arrow)"/>
    <path d="M0 110 A 120 120 0 0 1 -110 0" fill="none" stroke="#0066cc" stroke-width="3" stroke-dasharray="10,5" marker-end="url(#scatter-arrow)"/>
    <path d="M-110 0 A 120 120 0 0 1 0 -110" fill="none" stroke="#0066cc" stroke-width="3" stroke-dasharray="10,5" marker-end="url(#scatter-arrow)"/>
    
    <!-- 标注阶段1 -->
    <text x="0" y="-180" text-anchor="middle" font-family="Arial" font-size="14" fill="#0066cc" font-weight="bold">阶段1: Scatter-Reduce</text>
    
    <!-- Gather阶段箭头 -->
    <path d="M20 -110 A 100 100 0 0 0 -90 0" fill="none" stroke="#cc0000" stroke-width="3" marker-end="url(#gather-arrow)"/>
    <path d="M-90 0 A 100 100 0 0 0 20 110" fill="none" stroke="#cc0000" stroke-width="3" marker-end="url(#gather-arrow)"/>
    <path d="M20 110 A 100 100 0 0 0 130 0" fill="none" stroke="#cc0000" stroke-width="3" marker-end="url(#gather-arrow)"/>
    <path d="M130 0 A 100 100 0 0 0 20 -110" fill="none" stroke="#cc0000" stroke-width="3" marker-end="url(#gather-arrow)"/>
    
    <!-- 标注阶段2 -->
    <text x="0" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="#cc0000" font-weight="bold">阶段2: AllGather</text>
  </g>
  
  <!-- 数据块图例 -->
  <g transform="translate(130, 480)">
    <rect x="0" y="0" width="30" height="20" fill="#e6f7ff" stroke="#0066cc" stroke-width="1"/>
    <rect x="30" y="0" width="30" height="20" fill="#fff0f0" stroke="#cc0000" stroke-width="1"/>
    <rect x="60" y="0" width="30" height="20" fill="#f0ffe6" stroke="#339900" stroke-width="1"/>
    <rect x="90" y="0" width="30" height="20" fill="#fff6e6" stroke="#ff9900" stroke-width="1"/>
    <text x="60" y="-10" text-anchor="middle" font-family="Arial" font-size="12">数据块</text>
    <text x="25" y="35" text-anchor="middle" font-family="Arial" font-size="10">GPU1</text>
    <text x="55" y="35" text-anchor="middle" font-family="Arial" font-size="10">GPU2</text>
    <text x="85" y="35" text-anchor="middle" font-family="Arial" font-size="10">GPU3</text>
    <text x="115" y="35" text-anchor="middle" font-family="Arial" font-size="10">GPU4</text>
  </g>
  
  <!-- 阶段1说明 -->
  <g transform="translate(400, 480)">
    <rect x="-270" y="0" width="250" height="90" rx="5" fill="#f8f8f8" stroke="#0066cc" stroke-width="2"/>
    <text x="-145" y="20" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#0066cc">阶段1: Scatter-Reduce</text>
    <text x="-145" y="45" text-anchor="middle" font-family="Arial" font-size="12">1. 每个GPU将梯度分成N份(N=GPU数量)</text>
    <text x="-145" y="65" text-anchor="middle" font-family="Arial" font-size="12">2. 每轮通信每个GPU发送一份给下一个GPU</text>
    <text x="-145" y="85" text-anchor="middle" font-family="Arial" font-size="12">3. 接收的GPU将数据与自己对应部分求和</text>
  </g>
  
  <!-- 阶段2说明 -->
  <g transform="translate(400, 480)">
    <rect x="20" y="0" width="250" height="90" rx="5" fill="#f8f8f8" stroke="#cc0000" stroke-width="2"/>
    <text x="145" y="20" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#cc0000">阶段2: AllGather</text>
    <text x="145" y="45" text-anchor="middle" font-family="Arial" font-size="12">1. 每个GPU持有一份完整求和的数据块</text>
    <text x="145" y="65" text-anchor="middle" font-family="Arial" font-size="12">2. 每轮通信每个GPU发送求和块给上一个GPU</text>
    <text x="145" y="85" text-anchor="middle" font-family="Arial" font-size="12">3. 最终每个GPU都获得所有完整求和的块</text>
  </g>
  
  <!-- 优势说明 -->
  <g transform="translate(400, 600)">
    <rect x="-350" y="0" width="700" height="80" rx="5" fill="#f0f0f0" stroke="#333" stroke-width="1"/>
    <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Ring-AllReduce的优势:</text>
    <text x="0" y="45" text-anchor="middle" font-family="Arial" font-size="14">• 带宽利用率高：每个GPU只与相邻GPU通信，带宽利用率100%</text>
    <text x="0" y="70" text-anchor="middle" font-family="Arial" font-size="14">• 通信量固定：与GPU数量无关，仅需2(N-1)次通信</text>
  </g>
</svg>
