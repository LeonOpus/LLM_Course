<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200">
  <!-- 硬盘存储图标 -->
  <g transform="translate(50, 100)">
    <rect x="-30" y="-30" width="60" height="60" rx="5" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <circle cx="0" cy="0" r="15" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#333" stroke-width="2"/>
    <text x="0" y="45" text-anchor="middle" font-family="Arial" font-size="14">数据存储</text>
  </g>
  
  <!-- 箭头1 -->
  <path d="M95 100 L145 100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 数据集/文件图标 -->
  <g transform="translate(180, 100)">
    <rect x="-30" y="-25" width="50" height="60" rx="3" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <line x1="-20" y1="-10" x2="10" y2="-10" stroke="#333" stroke-width="1"/>
    <line x1="-20" y1="0" x2="10" y2="0" stroke="#333" stroke-width="1"/>
    <line x1="-20" y1="10" x2="10" y2="10" stroke="#333" stroke-width="1"/>
    <rect x="-25" y="-30" width="50" height="60" rx="3" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <line x1="-15" y1="-15" x2="15" y2="-15" stroke="#333" stroke-width="1"/>
    <line x1="-15" y1="-5" x2="15" y2="-5" stroke="#333" stroke-width="1"/>
    <line x1="-15" y1="5" x2="15" y2="5" stroke="#333" stroke-width="1"/>
    <rect x="-20" y="-35" width="50" height="60" rx="3" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <line x1="-10" y1="-20" x2="20" y2="-20" stroke="#333" stroke-width="1"/>
    <line x1="-10" y1="-10" x2="20" y2="-10" stroke="#333" stroke-width="1"/>
    <line x1="-10" y1="0" x2="20" y2="0" stroke="#333" stroke-width="1"/>
    <line x1="-10" y1="10" x2="20" y2="10" stroke="#333" stroke-width="1"/>
    <text x="0" y="45" text-anchor="middle" font-family="Arial" font-size="14">数据集</text>
  </g>
  
  <!-- 箭头2 -->
  <path d="M225 100 L275 100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- CPU/处理器图标 -->
  <g transform="translate(310, 100)">
    <rect x="-30" y="-30" width="60" height="60" rx="5" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <line x1="-20" y1="-20" x2="20" y2="-20" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="10" x2="20" y2="10" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="20" x2="20" y2="20" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="-20" x2="-20" y2="20" stroke="#333" stroke-width="1.5"/>
    <line x1="-10" y1="-20" x2="-10" y2="20" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#333" stroke-width="1.5"/>
    <line x1="10" y1="-20" x2="10" y2="20" stroke="#333" stroke-width="1.5"/>
    <line x1="20" y1="-20" x2="20" y2="20" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="45" text-anchor="middle" font-family="Arial" font-size="14">CPU处理</text>
  </g>
  
  <!-- 箭头3 -->
  <path d="M355 100 L405 100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- GPU训练图标 -->
  <g transform="translate(440, 100)">
    <rect x="-30" y="-30" width="60" height="60" rx="5" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="-20" y="-20" width="40" height="30" rx="2" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <circle cx="-5" cy="20" r="5" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <circle cx="5" cy="20" r="5" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <circle cx="15" cy="20" r="5" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="45" text-anchor="middle" font-family="Arial" font-size="14">GPU训练</text>
  </g>
  
  <!-- 箭头4 -->
  <path d="M485 100 L535 100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 训练输出图标 -->
  <g transform="translate(570, 100)">
    <rect x="-30" y="-35" width="60" height="70" rx="3" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <line x1="-20" y1="-25" x2="20" y2="-25" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="-15" x2="0" y2="-15" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="-5" x2="15" y2="-5" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="15" x2="10" y2="15" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="25" x2="20" y2="25" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="45" text-anchor="middle" font-family="Arial" font-size="14">输出模型</text>
  </g>
  
  <!-- 箭头5 -->
  <path d="M615 100 L665 100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 神经网络模型图标 -->
  <g transform="translate(700, 100)">
    <!-- 输入层 -->
    <circle cx="-25" cy="-20" r="5" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <circle cx="-25" cy="0" r="5" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <circle cx="-25" cy="20" r="5" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    
    <!-- 隐藏层 -->
    <circle cx="0" cy="-30" r="5" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="-10" r="5" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="10" r="5" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="30" r="5" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    
    <!-- 输出层 -->
    <circle cx="25" cy="-15" r="5" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <circle cx="25" cy="15" r="5" fill="#000" stroke="#333" stroke-width="1.5"/>
    
    <!-- 连接线 -->
    <!-- 输入到隐藏 -->
    <line x1="-20" y1="-20" x2="-5" y2="-30" stroke="#aaa" stroke-width="0.8"/>
    <line x1="-20" y1="-20" x2="-5" y2="-10" stroke="#aaa" stroke-width="0.8"/>
    <line x1="-20" y1="-20" x2="-5" y2="10" stroke="#aaa" stroke-width="0.8"/>
    <line x1="-20" y1="-20" x2="-5" y2="30" stroke="#aaa" stroke-width="0.8"/>
    
    <line x1="-20" y1="0" x2="-5" y2="-30" stroke="#aaa" stroke-width="0.8"/>
    <line x1="-20" y1="0" x2="-5" y2="-10" stroke="#aaa" stroke-width="0.8"/>
    <line x1="-20" y1="0" x2="-5" y2="10" stroke="#aaa" stroke-width="0.8"/>
    <line x1="-20" y1="0" x2="-5" y2="30" stroke="#aaa" stroke-width="0.8"/>
    
    <line x1="-20" y1="20" x2="-5" y2="-30" stroke="#aaa" stroke-width="0.8"/>
    <line x1="-20" y1="20" x2="-5" y2="-10" stroke="#aaa" stroke-width="0.8"/>
    <line x1="-20" y1="20" x2="-5" y2="10" stroke="#aaa" stroke-width="0.8"/>
    <line x1="-20" y1="20" x2="-5" y2="30" stroke="#aaa" stroke-width="0.8"/>
    
    <!-- 隐藏到输出 -->
    <line x1="5" y1="-30" x2="20" y2="-15" stroke="#aaa" stroke-width="0.8"/>
    <line x1="5" y1="-10" x2="20" y2="-15" stroke="#aaa" stroke-width="0.8"/>
    <line x1="5" y1="10" x2="20" y2="-15" stroke="#aaa" stroke-width="0.8"/>
    <line x1="5" y1="30" x2="20" y2="-15" stroke="#aaa" stroke-width="0.8"/>
    
    <line x1="5" y1="-30" x2="20" y2="15" stroke="#aaa" stroke-width="0.8"/>
    <line x1="5" y1="-10" x2="20" y2="15" stroke="#aaa" stroke-width="0.8"/>
    <line x1="5" y1="10" x2="20" y2="15" stroke="#aaa" stroke-width="0.8"/>
    <line x1="5" y1="30" x2="20" y2="15" stroke="#aaa" stroke-width="0.8"/>
    
    <text x="0" y="45" text-anchor="middle" font-family="Arial" font-size="14">训练模型</text>
  </g>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
