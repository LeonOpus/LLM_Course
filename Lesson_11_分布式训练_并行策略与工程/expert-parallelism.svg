<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- 背景和标题 -->
  <rect width="800" height="500" fill="#f8f9fa" />
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">大模型专家并行 (Mixture of Experts) 架构</text>
  
  <!-- 输入层 -->
  <rect x="350" y="80" width="100" height="40" rx="5" fill="#4285f4" />
  <text x="400" y="105" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">输入 (Input)</text>
  
  <!-- 路由层 -->
  <rect x="300" y="150" width="200" height="50" rx="5" fill="#ea4335" />
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">路由器 (Router/Gate)</text>
  
  <!-- 路由连接线 -->
  <line x1="400" y1="120" x2="400" y2="150" stroke="#666" stroke-width="2" />
  <polygon points="400,150 395,140 405,140" fill="#666" />
  
  <!-- 专家网络 - 设备1 -->
  <rect x="100" y="260" width="280" height="140" rx="5" stroke="#34a853" stroke-width="2" fill="#ffffff" />
  <text x="240" y="280" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333">计算设备 1</text>
  
  <!-- 专家网络 - 设备2 -->
  <rect x="420" y="260" width="280" height="140" rx="5" stroke="#fbbc05" stroke-width="2" fill="#ffffff" />
  <text x="560" y="280" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333">计算设备 2</text>
  
  <!-- 专家 1-4 -->
  <rect x="120" y="300" width="80" height="80" rx="5" fill="#34a853" />
  <text x="160" y="345" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">专家 1</text>
  
  <rect x="220" y="300" width="80" height="80" rx="5" fill="#34a853" opacity="0.6" />
  <text x="260" y="345" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">专家 2</text>
  
  <rect x="320" y="300" width="80" height="80" rx="5" fill="#34a853" />
  <text x="360" y="345" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">专家 3</text>
  
  <rect x="420" y="300" width="80" height="80" rx="5" fill="#fbbc05" opacity="0.6" />
  <text x="460" y="345" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">专家 4</text>
  
  <!-- 专家 5-8 -->
  <rect x="520" y="300" width="80" height="80" rx="5" fill="#fbbc05" />
  <text x="560" y="345" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">专家 5</text>
  
  <rect x="620" y="300" width="80" height="80" rx="5" fill="#fbbc05" opacity="0.6" />
  <text x="660" y="345" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">专家 6</text>
  
  <!-- 路由到专家的连接线 - 激活的专家 -->
  <line x1="400" y1="200" x2="160" y2="300" stroke="#ea4335" stroke-width="2" />
  <polygon points="160,300 165,290 175,295" fill="#ea4335" />
  
  <line x1="400" y1="200" x2="360" y2="300" stroke="#ea4335" stroke-width="2" />
  <polygon points="360,300 365,290 375,295" fill="#ea4335" />
  
  <line x1="400" y1="200" x2="560" y2="300" stroke="#ea4335" stroke-width="2" />
  <polygon points="560,300 565,290 575,295" fill="#ea4335" />
  
  <!-- 路由到专家的连接线 - 未激活的专家 (虚线) -->
  <line x1="400" y1="200" x2="260" y2="300" stroke="#ea4335" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="400" y1="200" x2="460" y2="300" stroke="#ea4335" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="400" y1="200" x2="660" y2="300" stroke="#ea4335" stroke-width="1" stroke-dasharray="5,5" />
  
  <!-- 融合层 -->
  <rect x="300" y="430" width="200" height="50" rx="5" fill="#4285f4" />
  <text x="400" y="460" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">结果融合 (Combination)</text>
  
  <!-- 激活专家到融合层的连接 -->
  <line x1="160" y1="380" x2="350" y2="430" stroke="#666" stroke-width="2" />
  <line x1="360" y1="380" x2="375" y2="430" stroke="#666" stroke-width="2" />
  <line x1="560" y1="380" x2="450" y2="430" stroke="#666" stroke-width="2" />
  
  <!-- 标注 -->
  <text x="680" y="440" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">实线: 激活路径</text>
  <text x="680" y="460" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">虚线: 未激活路径</text>
  <text x="680" y="480" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">透明专家: 未被选中</text>
</svg>
