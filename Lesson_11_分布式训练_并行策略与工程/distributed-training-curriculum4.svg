<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
  <!-- Background -->
  <rect width="800" height="550" fill="#F0F2F5"/>
  
  <!-- Title and subtitle -->
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1D3557" text-anchor="middle">分布式训练系统开发课程</text>
  
  <!-- Divider -->
  <line x1="85" y1="65" x2="715" y2="65" stroke="#1D3557" stroke-width="1.5"/>
  
  <!-- Course Content Title -->
  <text x="85" y="95" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1D3557">课程目录</text>
  
  <!-- Left column: Curriculum -->
  <g transform="translate(85, 120)">
    <!-- 1. Data Parallelism -->
    <text y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1D3557">数据并行(Data Parallelism)</text>
    <line x1="0" y1="5" x2="40" y2="5" stroke="#1D3557" stroke-width="2"/>
    <line x1="0" y1="45" x2="40" y2="45" stroke="#1D3557" stroke-width="2"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" fill="#1D3557">DDP(Distributed Data Parallel)</text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="14" fill="#1D3557">DP(PyTorch), Sharded Data Parallelism</text>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="14" fill="#1D3557">DeepSpeed-ZeRO</text>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="14" fill="#1D3557">分布式通信(Distributed Communication)</text>
    <text x="20" y="125" font-family="Arial, sans-serif" font-size="14" fill="#1D3557">混合精度训练(Mixed Precision Training)</text>
    <text x="20" y="150" font-family="Arial, sans-serif" font-size="14" fill="#1D3557">常见数据形式</text>
    
    <!-- 2. Model Parallelism -->
    <text y="180" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1D3557">模型并行(Model Parallelism)</text>
    <line x1="0" y1="185" x2="40" y2="185" stroke="#1D3557" stroke-width="2"/>
    <text x="20" y="205" font-family="Arial, sans-serif" font-size="14" fill="#1D3557">张量并行(Tensor Parallelism, TP)</text>
    <text x="20" y="230" font-family="Arial, sans-serif" font-size="14" fill="#1D3557">流水线并行(Pipeline Parallelism, PP)</text>
    <text x="20" y="255" font-family="Arial, sans-serif" font-size="14" fill="#1D3557">序列并行(Sequence Parallelism, SP)</text>
    <text x="20" y="280" font-family="Arial, sans-serif" font-size="14" fill="#1D3557">上下文并行(Context Parallelism, CP)</text>
    <text x="20" y="305" font-family="Arial, sans-serif" font-size="14" fill="#1D3557">专家并行(Expert Parallelism, EP)</text>
    
    <!-- 3. Accelerate+DeepSpeed -->
    <text y="335" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1D3557">手写accelerate+deepspeed训练</text>
    <line x1="0" y1="340" x2="40" y2="340" stroke="#1D3557" stroke-width="2"/>
    
    <!-- 4. Practical Training -->
    <text y="370" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1D3557">实战：弱智吧数据微调Qwen2.5模型（录播）</text>
    <line x1="0" y1="375" x2="40" y2="375" stroke="#1D3557" stroke-width="2"/>
  </g>
  
  <!-- Right column: Diagram -->
  <g transform="translate(500, 230)">
    <!-- Distributed Training Diagram -->
    <rect x="0" y="0" width="200" height="200" rx="10" fill="none" stroke="#1D3557" stroke-width="2"/>
    
    <!-- Components -->
    <rect x="-60" y="-40" width="80" height="35" rx="5" stroke="#1D3557" fill="white" stroke-width="1.5"/>
    <text x="-20" y="-17" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1D3557">数据分片</text>
    
    <rect x="60" y="-40" width="80" height="35" rx="5" stroke="#1D3557" fill="white" stroke-width="1.5"/>
    <text x="100" y="-17" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1D3557">模型分片</text>
    
    <!-- Center diagram -->
    <circle cx="40" cy="70" r="25" fill="white" stroke="#1D3557" stroke-width="1.5"/>
    <text x="40" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1D3557">GPU 1</text>
    
    <circle cx="160" cy="70" r="25" fill="white" stroke="#1D3557" stroke-width="1.5"/>
    <text x="160" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1D3557">GPU 2</text>
    
    <circle cx="40" cy="150" r="25" fill="white" stroke="#1D3557" stroke-width="1.5"/>
    <text x="40" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1D3557">GPU 3</text>
    
    <circle cx="160" cy="150" r="25" fill="white" stroke="#1D3557" stroke-width="1.5"/>
    <text x="160" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1D3557">GPU 4</text>
    
    <!-- Communication lines -->
    <line x1="65" y1="70" x2="135" y2="70" stroke="#1D3557" stroke-width="1.5" stroke-dasharray="5,3"/>
    <line x1="40" y1="95" x2="40" y2="125" stroke="#1D3557" stroke-width="1.5" stroke-dasharray="5,3"/>
    <line x1="160" y1="95" x2="160" y2="125" stroke="#1D3557" stroke-width="1.5" stroke-dasharray="5,3"/>
    <line x1="65" y1="150" x2="135" y2="150" stroke="#1D3557" stroke-width="1.5" stroke-dasharray="5,3"/>
    <line x1="65" y1="70" x2="135" y2="150" stroke="#1D3557" stroke-width="1.5" stroke-dasharray="5,3"/>
    <line x1="65" y1="150" x2="135" y2="70" stroke="#1D3557" stroke-width="1.5" stroke-dasharray="5,3"/>
    
    <text x="100" y="190" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1D3557">分布式通信</text>
  </g>
</svg>
