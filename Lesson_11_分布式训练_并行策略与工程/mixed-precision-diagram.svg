<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- 背景和标题 -->
  <rect width="800" height="500" fill="#f8f9fa" />
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold">混合精度训练流程图</text>
  
  <!-- 图例 -->
  <rect x="620" y="60" width="20" height="20" fill="#4682b4" />
  <text x="650" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="start">全精度 (FP32)</text>
  
  <rect x="620" y="90" width="20" height="20" fill="#ff7f50" />
  <text x="650" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="start">半精度 (FP16)</text>
  
  <!-- 主权重 (Master Weights) -->
  <rect x="100" y="110" width="120" height="60" rx="10" ry="10" fill="#4682b4" stroke="#333" stroke-width="2" />
  <text x="160" y="145" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">主权重</text>
  <text x="160" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(FP32)</text>
  
  <!-- 复制到FP16 -->
  <rect x="300" y="110" width="120" height="60" rx="10" ry="10" fill="#ff7f50" stroke="#333" stroke-width="2" />
  <text x="360" y="145" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">模型权重副本</text>
  <text x="360" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(FP16)</text>
  
  <!-- 前向传播 -->
  <rect x="300" y="210" width="120" height="60" rx="10" ry="10" fill="#ff7f50" stroke="#333" stroke-width="2" />
  <text x="360" y="245" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">前向传播</text>
  <text x="360" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(FP16)</text>
  
  <!-- 损失计算和缩放 -->
  <rect x="500" y="210" width="120" height="60" rx="10" ry="10" fill="#ff7f50" stroke="#333" stroke-width="2" />
  <text x="560" y="238" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">损失计算</text>
  <text x="560" y="258" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">与缩放</text>
  <text x="560" y="278" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(FP16)</text>
  
  <!-- 反向传播 -->
  <rect x="300" y="310" width="120" height="60" rx="10" ry="10" fill="#ff7f50" stroke="#333" stroke-width="2" />
  <text x="360" y="345" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">反向传播</text>
  <text x="360" y="365" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(FP16)</text>
  
  <!-- 梯度转换和缩放 -->
  <rect x="100" y="310" width="120" height="60" rx="10" ry="10" fill="#4682b4" stroke="#333" stroke-width="2" />
  <text x="160" y="335" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">梯度转换</text>
  <text x="160" y="355" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">和反向缩放</text>
  <text x="160" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(FP32)</text>
  
  <!-- 优化器状态 -->
  <rect x="100" y="410" width="120" height="60" rx="10" ry="10" fill="#4682b4" stroke="#333" stroke-width="2" />
  <text x="160" y="445" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">优化器状态</text>
  <text x="160" y="465" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(FP32)</text>
  
  <!-- 箭头 -->
  <!-- 主权重到FP16副本 -->
  <path d="M220 140 L300 140" stroke="#333" stroke-width="2" fill="none" />
  <polygon points="295,135 305,140 295,145" fill="#333" />
  
  <!-- FP16副本到前向传播 -->
  <path d="M360 170 L360 210" stroke="#333" stroke-width="2" fill="none" />
  <polygon points="355,205 360,215 365,205" fill="#333" />
  
  <!-- 前向传播到损失计算 -->
  <path d="M420 240 L500 240" stroke="#333" stroke-width="2" fill="none" />
  <polygon points="495,235 505,240 495,245" fill="#333" />
  
  <!-- 损失计算到反向传播 -->
  <path d="M560 270 L560 340 L420 340" stroke="#333" stroke-width="2" fill="none" />
  <polygon points="425,335 415,340 425,345" fill="#333" />
  
  <!-- 反向传播到梯度转换 -->
  <path d="M300 340 L220 340" stroke="#333" stroke-width="2" fill="none" />
  <polygon points="225,335 215,340 225,345" fill="#333" />
  
  <!-- 梯度转换到优化器 -->
  <path d="M160 370 L160 410" stroke="#333" stroke-width="2" fill="none" />
  <polygon points="155,405 160,415 165,405" fill="#333" />
  
  <!-- 优化器到主权重 -->
  <path d="M100 440 L60 440 L60 140 L100 140" stroke="#333" stroke-width="2" fill="none" />
  <polygon points="95,135 105,140 95,145" fill="#333" />
  
  <!-- 说明注释 -->
  <text x="230" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">复制</text>
  <text x="390" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">计算</text>
  <text x="460" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">传递</text>
  <text x="500" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">乘以损失缩放因子</text>
  <text x="260" y="325" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">FP16→FP32</text>
  <text x="230" y="355" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">除以缩放因子</text>
  <text x="80" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">更新</text>
  <text x="80" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">权重</text>
</svg>
