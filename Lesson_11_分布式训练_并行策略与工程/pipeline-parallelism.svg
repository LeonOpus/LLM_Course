<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="white"/>
  
  <!-- 标题 -->
  <text x="400" y="40" font-size="24" text-anchor="middle" font-weight="bold">流水线并行处理示意图</text>
  
  <!-- 时间轴 -->
  <line x1="100" y1="100" x2="750" y2="100" stroke="#ccc" stroke-width="2"/>
  <text x="70" y="105" font-size="16" text-anchor="end">时间</text>
  <polygon points="750,100 740,95 740,105" fill="#ccc"/>
  
  <!-- 时间刻度 -->
  <line x1="150" y1="95" x2="150" y2="105" stroke="#999" stroke-width="2"/>
  <text x="150" y="90" font-size="14" text-anchor="middle">T1</text>
  
  <line x1="250" y1="95" x2="250" y2="105" stroke="#999" stroke-width="2"/>
  <text x="250" y="90" font-size="14" text-anchor="middle">T2</text>
  
  <line x1="350" y1="95" x2="350" y2="105" stroke="#999" stroke-width="2"/>
  <text x="350" y="90" font-size="14" text-anchor="middle">T3</text>
  
  <line x1="450" y1="95" x2="450" y2="105" stroke="#999" stroke-width="2"/>
  <text x="450" y="90" font-size="14" text-anchor="middle">T4</text>
  
  <line x1="550" y1="95" x2="550" y2="105" stroke="#999" stroke-width="2"/>
  <text x="550" y="90" font-size="14" text-anchor="middle">T5</text>
  
  <line x1="650" y1="95" x2="650" y2="105" stroke="#999" stroke-width="2"/>
  <text x="650" y="90" font-size="14" text-anchor="middle">T6</text>
  
  <!-- GPU标签 -->
  <text x="70" y="150" font-size="16" text-anchor="end" font-weight="bold">GPU 1</text>
  <text x="70" y="220" font-size="16" text-anchor="end" font-weight="bold">GPU 2</text>
  <text x="70" y="290" font-size="16" text-anchor="end" font-weight="bold">GPU 3</text>
  <text x="70" y="360" font-size="16" text-anchor="end" font-weight="bold">GPU 4</text>
  
  <!-- 水平分隔线 -->
  <line x1="100" y1="180" x2="750" y2="180" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="100" y1="250" x2="750" y2="250" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="100" y1="320" x2="750" y2="320" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="100" y1="390" x2="750" y2="390" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- 批次1的处理 -->
  <rect x="150" y="130" width="100" height="40" rx="5" ry="5" fill="#4285F4" opacity="0.8"/>
  <text x="200" y="155" font-size="14" text-anchor="middle" fill="white">批次1-层1</text>
  
  <rect x="250" y="200" width="100" height="40" rx="5" ry="5" fill="#4285F4" opacity="0.8"/>
  <text x="300" y="225" font-size="14" text-anchor="middle" fill="white">批次1-层2</text>
  
  <rect x="350" y="270" width="100" height="40" rx="5" ry="5" fill="#4285F4" opacity="0.8"/>
  <text x="400" y="295" font-size="14" text-anchor="middle" fill="white">批次1-层3</text>
  
  <rect x="450" y="340" width="100" height="40" rx="5" ry="5" fill="#4285F4" opacity="0.8"/>
  <text x="500" y="365" font-size="14" text-anchor="middle" fill="white">批次1-层4</text>
  
  <!-- 批次2的处理 -->
  <rect x="250" y="130" width="100" height="40" rx="5" ry="5" fill="#DB4437" opacity="0.8"/>
  <text x="300" y="155" font-size="14" text-anchor="middle" fill="white">批次2-层1</text>
  
  <rect x="350" y="200" width="100" height="40" rx="5" ry="5" fill="#DB4437" opacity="0.8"/>
  <text x="400" y="225" font-size="14" text-anchor="middle" fill="white">批次2-层2</text>
  
  <rect x="450" y="270" width="100" height="40" rx="5" ry="5" fill="#DB4437" opacity="0.8"/>
  <text x="500" y="295" font-size="14" text-anchor="middle" fill="white">批次2-层3</text>
  
  <rect x="550" y="340" width="100" height="40" rx="5" ry="5" fill="#DB4437" opacity="0.8"/>
  <text x="600" y="365" font-size="14" text-anchor="middle" fill="white">批次2-层4</text>
  
  <!-- 批次3的处理 -->
  <rect x="350" y="130" width="100" height="40" rx="5" ry="5" fill="#F4B400" opacity="0.8"/>
  <text x="400" y="155" font-size="14" text-anchor="middle" fill="white">批次3-层1</text>
  
  <rect x="450" y="200" width="100" height="40" rx="5" ry="5" fill="#F4B400" opacity="0.8"/>
  <text x="500" y="225" font-size="14" text-anchor="middle" fill="white">批次3-层2</text>
  
  <rect x="550" y="270" width="100" height="40" rx="5" ry="5" fill="#F4B400" opacity="0.8"/>
  <text x="600" y="295" font-size="14" text-anchor="middle" fill="white">批次3-层3</text>
  
  <rect x="650" y="340" width="100" height="40" rx="5" ry="5" fill="#F4B400" opacity="0.8"/>
  <text x="700" y="365" font-size="14" text-anchor="middle" fill="white">批次3-层4</text>
  
  <!-- 批次4的处理（部分） -->
  <rect x="450" y="130" width="100" height="40" rx="5" ry="5" fill="#0F9D58" opacity="0.8"/>
  <text x="500" y="155" font-size="14" text-anchor="middle" fill="white">批次4-层1</text>
  
  <rect x="550" y="200" width="100" height="40" rx="5" ry="5" fill="#0F9D58" opacity="0.8"/>
  <text x="600" y="225" font-size="14" text-anchor="middle" fill="white">批次4-层2</text>
  
  <rect x="650" y="270" width="100" height="40" rx="5" ry="5" fill="#0F9D58" opacity="0.8"/>
  <text x="700" y="295" font-size="14" text-anchor="middle" fill="white">批次4-层3</text>
  
  <!-- 数据流向箭头 -->
  <!-- 批次1 -->
  <path d="M250,150 L250,200" stroke="#4285F4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M350,220 L350,270" stroke="#4285F4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M450,290 L450,340" stroke="#4285F4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 批次2 -->
  <path d="M350,150 L350,200" stroke="#DB4437" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M450,220 L450,270" stroke="#DB4437" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M550,290 L550,340" stroke="#DB4437" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 批次3 -->
  <path d="M450,150 L450,200" stroke="#F4B400" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M550,220 L550,270" stroke="#F4B400" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M650,290 L650,340" stroke="#F4B400" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 批次4 -->
  <path d="M550,150 L550,200" stroke="#0F9D58" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M650,220 L650,270" stroke="#0F9D58" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  
  <!-- 图例 -->
  <rect x="150" y="420" width="20" height="20" rx="3" ry="3" fill="#4285F4" opacity="0.8"/>
  <text x="180" y="435" font-size="14" text-anchor="start">批次1</text>
  
  <rect x="250" y="420" width="20" height="20" rx="3" ry="3" fill="#DB4437" opacity="0.8"/>
  <text x="280" y="435" font-size="14" text-anchor="start">批次2</text>
  
  <rect x="350" y="420" width="20" height="20" rx="3" ry="3" fill="#F4B400" opacity="0.8"/>
  <text x="380" y="435" font-size="14" text-anchor="start">批次3</text>
  
  <rect x="450" y="420" width="20" height="20" rx="3" ry="3" fill="#0F9D58" opacity="0.8"/>
  <text x="480" y="435" font-size="14" text-anchor="start">批次4</text>
  
  <!-- 说明文字 -->
  <text x="150" y="470" font-size="14" text-anchor="start">每个GPU处理模型的不同层，多个数据批次同时在不同GPU上流水线式处理</text>
</svg>
