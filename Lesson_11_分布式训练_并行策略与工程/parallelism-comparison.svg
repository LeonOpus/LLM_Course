<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">序列并行 vs 张量并行</text>
  
  <!-- 序列并行部分 -->
  <text x="200" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">序列并行 (Sequence Parallelism)</text>
  
  <!-- 序列并行示意图 -->
  <rect x="50" y="90" width="300" height="150" rx="10" fill="#e6f2ff" stroke="#aac8e4" stroke-width="2"/>
  
  <!-- 输入序列 -->
  <rect x="60" y="105" width="280" height="30" rx="5" fill="#c5ddf9" stroke="#6fa8dc" stroke-width="1"/>
  <text x="200" y="125" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">输入序列 [t₁, t₂, t₃, t₄, t₅, t₆, t₇, t₈]</text>
  
  <!-- 设备分割线 -->
  <line x1="200" y1="145" x2="200" y2="180" stroke="#999" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- GPU 1 -->
  <rect x="70" y="150" width="120" height="60" rx="5" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="130" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GPU 1</text>
  <text x="130" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">[t₁, t₂, t₃, t₄]</text>
  
  <!-- GPU 2 -->
  <rect x="210" y="150" width="120" height="60" rx="5" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="270" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GPU 2</text>
  <text x="270" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">[t₅, t₆, t₇, t₈]</text>
  
  <!-- 通信箭头 -->
  <line x1="140" y1="220" x2="260" y2="220" stroke="#d14836" stroke-width="2"/>
  <line x1="260" y1="220" x2="250" y2="215" stroke="#d14836" stroke-width="2"/>
  <line x1="260" y1="220" x2="250" y2="225" stroke="#d14836" stroke-width="2"/>
  <text x="200" y="215" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d14836">注意力计算需要通信</text>
  
  <!-- 张量并行部分 -->
  <text x="600" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">张量并行 (Tensor Parallelism)</text>
  
  <!-- 张量并行示意图 -->
  <rect x="450" y="90" width="300" height="150" rx="10" fill="#fff2e6" stroke="#ffcc99" stroke-width="2"/>
  
  <!-- 神经网络层 -->
  <rect x="460" y="105" width="280" height="30" rx="5" fill="#ffe0cc" stroke="#ff9966" stroke-width="1"/>
  <text x="600" y="125" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">神经网络层 W ∈ R^(d×d)</text>
  
  <!-- 设备分割线 -->
  <line x1="600" y1="145" x2="600" y2="180" stroke="#999" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- GPU 1 -->
  <rect x="470" y="150" width="120" height="60" rx="5" fill="#d5a6bd" stroke="#c27ba0" stroke-width="2"/>
  <text x="530" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GPU 1</text>
  <text x="530" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">W[:, 0:d/2]</text>
  
  <!-- GPU 2 -->
  <rect x="610" y="150" width="120" height="60" rx="5" fill="#d5a6bd" stroke="#c27ba0" stroke-width="2"/>
  <text x="670" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GPU 2</text>
  <text x="670" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">W[:, d/2:d]</text>
  
  <!-- 通信箭头 -->
  <line x1="540" y1="220" x2="660" y2="220" stroke="#d14836" stroke-width="2"/>
  <line x1="660" y1="220" x2="650" y2="215" stroke="#d14836" stroke-width="2"/>
  <line x1="660" y1="220" x2="650" y2="225" stroke="#d14836" stroke-width="2"/>
  <text x="600" y="215" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d14836">All-Reduce操作</text>
  
  <!-- 主要区别说明 -->
  <rect x="50" y="260" width="700" height="220" rx="10" fill="#f0f0f0" stroke="#cccccc" stroke-width="2"/>
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">主要区别</text>
  
  <!-- 对比点 -->
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="16" font-weight="bold">1. 切分维度:</text>
  <text x="100" y="345" font-family="Arial, sans-serif" font-size="14">● 序列并行: 在序列长度维度上切分，不同GPU处理不同的序列部分</text>
  <text x="100" y="370" font-family="Arial, sans-serif" font-size="14">● 张量并行: 在模型参数维度上切分，不同GPU存储模型的不同部分</text>
  
  <text x="80" y="405" font-family="Arial, sans-serif" font-size="16" font-weight="bold">2. 通信模式:</text>
  <text x="100" y="430" font-family="Arial, sans-serif" font-size="14">● 序列并行: 需要在注意力计算时交换激活值，有跨序列依赖</text>
  <text x="100" y="455" font-family="Arial, sans-serif" font-size="14">● 张量并行: 主要使用All-Reduce操作合并计算结果</text>
</svg>
