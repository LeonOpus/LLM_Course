hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - data.train_files=/root/autodl-tmp/RM-R1/rm_r1/dataset/mix_data/train.jsonl
    - data.val_files=/root/autodl-tmp/RM-R1/rm_r1/dataset/mix_data/train.jsonl
    - data.max_prompt_length=4096
    - data.max_response_length=8192
    - data.train_batch_size=1024
    - actor_rollout_ref.model.path=/root/autodl-tmp/dsr1-7b
    - actor_rollout_ref.actor.optim.lr=1.0e-6
    - actor_rollout_ref.actor.ppo_mini_batch_size=128
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=4
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.5
    - actor_rollout_ref.rollout.max_num_batched_tokens=12288
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=4
    - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=4
    - custom_reward_function.path=./rm_r1/verl/utils/reward_score/lm_as_judge.py
    - custom_reward_function.name=lm_as_judge_match
    - trainer.project_name=RM-R1
    - trainer.total_epochs=1
    - trainer.save_freq=100
    - trainer.test_freq=-1
    - trainer.experiment_name=RM-R1-Dpsk-Distilled-7B-LR1.0e-6
    - trainer.n_gpus_per_node=4
    - actor_rollout_ref.actor.entropy_coeff=0
    - actor_rollout_ref.actor.optim.warmup_style=constant
    - trainer.default_local_dir=/root/autodl-tmp/meta/RM-R1-Dpsk-Distilled-7B-LR1.0e-6
  job:
    name: main_ppo
    chdir: null
    override_dirname: actor_rollout_ref.actor.entropy_coeff=0,actor_rollout_ref.actor.optim.lr=1.0e-6,actor_rollout_ref.actor.optim.warmup_style=constant,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=4,actor_rollout_ref.actor.ppo_mini_batch_size=128,actor_rollout_ref.model.path=/root/autodl-tmp/dsr1-7b,actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=4,actor_rollout_ref.rollout.gpu_memory_utilization=0.5,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=4,actor_rollout_ref.rollout.max_num_batched_tokens=12288,custom_reward_function.name=lm_as_judge_match,custom_reward_function.path=./rm_r1/verl/utils/reward_score/lm_as_judge.py,data.max_prompt_length=4096,data.max_response_length=8192,data.train_batch_size=1024,data.train_files=/root/autodl-tmp/RM-R1/rm_r1/dataset/mix_data/train.jsonl,data.val_files=/root/autodl-tmp/RM-R1/rm_r1/dataset/mix_data/train.jsonl,trainer.default_local_dir=/root/autodl-tmp/meta/RM-R1-Dpsk-Distilled-7B-LR1.0e-6,trainer.experiment_name=RM-R1-Dpsk-Distilled-7B-LR1.0e-6,trainer.n_gpus_per_node=4,trainer.project_name=RM-R1,trainer.save_freq=100,trainer.test_freq=-1,trainer.total_epochs=1
    id: ???
    num: ???
    config_name: ppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /root/autodl-tmp/RM-R1
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /root/autodl-tmp/RM-R1/rm_r1/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /root/autodl-tmp/RM-R1/outputs/2025-10-02/12-11-28
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
